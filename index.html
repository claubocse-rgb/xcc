<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XCC · Echipa noastră</title>
<meta name="description" content="Echipament, transport și echipe pentru Xtreme Character Challenge.">
<meta name="theme-color" content="#1D3A2C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='4' fill='white' stroke='%23ccc'/%3E%3Crect x='2' y='8.5' width='20' height='7' fill='%23D0161E'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='white'/%3E%3Crect y='8' width='24' height='8' fill='%23D0161E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* XCC v2 — "trail marker" field app.
   Fog-green ground, pine brand, 4M red only for markers and the one primary action per screen.
   Phone: pine top bar + bottom tab bar. Desktop (>=960px): pine left rail, content column. */
:root{
  --bg:#E8ECE6; --surface:#FFFFFF; --surface-2:#F3F5F1; --line:#D3DACF; --line-2:#BCC6B8;
  --text:#16231B; --muted:#56625A; --faint:#7C877F;
  --brand:#1D3A2C; --brand-2:#2A5040; --on-brand:#F1F5F2; --on-brand-muted:#A7BCAF;
  --accent:#C8161D; --accent-press:#A51117; --on-accent:#FFFFFF;
  --ok:#256B3A; --ok-soft:#DCEEDD; --need:#B0201C; --need-soft:#FBE3E1; --lend:#1C5D78; --lend-soft:#DCEDF3;
  --skip:#5C665F; --skip-soft:#E7EAE5; --warn:#8A5300; --warn-soft:#FBEBCD;
  --marker-bg:#FFFFFF; --marker-edge:#C9D1C5; --marker-red:#D0161E;
  --shadow-sheet:0 -12px 40px rgba(10,25,18,.22);
  --font-d:"Big Shoulders Display","Big Shoulders","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --font-b:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-s:8px; --r-m:14px; --r-l:20px;
  --tabbar-h:64px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1612; --surface:#15211B; --surface-2:#1B2922; --line:#29392F; --line-2:#3A4D41;
  --text:#E6EEE8; --muted:#A3B1A8; --faint:#7E8C83;
  --brand:#10221A; --brand-2:#1E3A2D; --on-brand:#EAF1EC; --on-brand-muted:#93AA9C;
  --accent:#E3343B; --accent-press:#C8161D; --on-accent:#FFFFFF;
  --ok:#6CC58A; --ok-soft:#183626; --need:#FF8A80; --need-soft:#3B1D1B; --lend:#7FC6E3; --lend-soft:#16313D;
  --skip:#A3B1A8; --skip-soft:#223029; --warn:#F2B65C; --warn-soft:#3A2B12;
  --marker-bg:#F4F6F3; --marker-edge:transparent; --marker-red:#D0161E;
  --shadow-sheet:0 -12px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.5 var(--font-b);font-feature-settings:"tnum" 1;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--lend)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- trail markers ---------- */
.mk{width:24px;height:24px;flex:none;display:block}
.mk rect.bg{fill:var(--marker-bg);stroke:var(--marker-edge)}
.mk .red{fill:var(--marker-red)}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--brand);color:var(--on-brand);padding:env(safe-area-inset-top,0px) 16px 0}
.topbar .in{height:56px;display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font:800 1.45rem/1 var(--font-d);letter-spacing:.02em}
.brand small{font:500 .8rem var(--font-b);color:var(--on-brand-muted);letter-spacing:0}
.avatar-btn{margin-left:auto;background:none;border:0;padding:4px;border-radius:999px}
.av{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;font:700 .85rem var(--font-b);color:#fff;flex:none}
.av.lg{width:52px;height:52px;font-size:1.1rem}
.shell{max-width:760px;margin:0 auto;padding:18px 16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  padding:0 6px env(safe-area-inset-bottom,0px);display:flex;justify-content:space-around}
.tab{flex:1;max-width:120px;height:var(--tabbar-h);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted);font:600 .74rem var(--font-b);position:relative}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .dot{position:absolute;top:8px;right:calc(50% - 20px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font:700 .68rem/18px var(--font-b)}
.rail{display:none}
body.noapp .tabbar,body.noapp .avatar-btn{display:none}

@media (min-width:960px){
  .topbar{display:none}
  body:not(.noapp) .rail{display:flex;position:fixed;inset:0 auto 0 0;width:248px;flex-direction:column;background:var(--brand);color:var(--on-brand);padding:22px 14px;gap:4px;z-index:40}
  .rail .brand{padding:0 8px 18px}
  .rail .nav{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--on-brand-muted);font:600 .98rem var(--font-b);padding:11px 10px;border-radius:10px;text-align:left}
  .rail .nav:hover{background:var(--brand-2);color:var(--on-brand)}
  .rail .nav[aria-current="page"]{background:var(--brand-2);color:var(--on-brand)}
  .rail .nav .dot{margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;font:700 .72rem/20px var(--font-b);min-width:20px;padding:0 6px;text-align:center}
  .rail .me{margin-top:auto;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--on-brand);padding:10px;border-radius:10px;text-align:left}
  .rail .me:hover{background:var(--brand-2)}
  .rail .me span small{display:block;color:var(--on-brand-muted);font-size:.8rem}
  .tabbar{display:none}
  body:not(.noapp) .shell{margin-left:248px;max-width:none;padding:34px 48px 60px}
  body:not(.noapp) .page{max-width:720px;margin:0 auto}
  body.noapp .topbar{display:block}
  body.noapp .shell{margin:0 auto}
}
.page{display:flex;flex-direction:column;gap:20px}

/* ---------- type ---------- */
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font:800 clamp(2.2rem,8vw,3rem)/.95 var(--font-d);letter-spacing:.005em}
.h2{font:800 1.55rem/1.05 var(--font-d);letter-spacing:.01em}
.h3{font:700 1.05rem/1.3 var(--font-b)}
.lead{margin:0;color:var(--muted);max-width:60ch}
.muted{color:var(--muted)}
.small{font-size:.875rem}
p{margin:0}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:var(--r-l);overflow:hidden;min-height:clamp(210px,44vw,320px);background:var(--brand);color:#fff;display:flex;align-items:flex-end;isolation:isolate}
.hero > img,.hero > svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,20,14,0) 35%,rgba(8,20,14,.82) 100%)}
.hero .txt{padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.hero h1{font:900 clamp(2.4rem,10vw,4rem)/.86 var(--font-d);letter-spacing:.005em}
.hero p{color:#DCE6DF;font-weight:500}
.count-pill{align-self:flex-start;display:inline-flex;align-items:baseline;gap:6px;background:var(--marker-bg);color:#16231B;border-radius:999px;padding:4px 12px 4px 6px;font-weight:600;font-size:.9rem}
.count-pill b{background:var(--marker-red);color:#fff;border-radius:999px;padding:1px 9px;font:800 1.05rem/1.4 var(--font-d)}

/* ---------- blocks ---------- */
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.block.flush{padding:0;overflow:hidden}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

/* next steps */
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.steps li:first-child .step{border-top:0}
.step:hover{background:var(--surface-2)}
.step .st{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;flex:none;font-weight:800}
.st.todo{background:var(--need-soft);color:var(--need)}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.wait{background:var(--skip-soft);color:var(--skip)}
.step .t{flex:1;min-width:0}
.step .t b{display:block;font-weight:650}
.step .t span{display:block;color:var(--muted);font-size:.9rem}
.step .chev{color:var(--faint);font-size:1.3rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:650;font-size:1rem;background:var(--accent);color:var(--on-accent);text-decoration:none;white-space:nowrap}
.btn:active{background:var(--accent-press)}
.btn.sec{background:var(--surface);border-color:var(--line-2);color:var(--text)}
.btn.sec:active{background:var(--surface-2)}
.btn.ghost{background:transparent;color:var(--text);border-color:transparent}
.btn.danger{background:transparent;border-color:var(--need);color:var(--need)}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem;border-radius:10px}
.btn.block-w{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.armed{background:var(--need);color:#fff;border-color:var(--need)}

/* segmented */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;min-height:40px;border:0;background:none;border-radius:9px;font-weight:650;color:var(--muted);padding:0 12px;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.seg.tight button{padding:0 8px;font-size:.88rem;flex:1 0 auto}
.seg .n{display:inline-block;margin-left:6px;background:var(--accent);color:#fff;border-radius:999px;font-size:.72rem;padding:0 6px;line-height:18px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.84rem;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.need{background:var(--need-soft);color:var(--need);border-color:transparent}
.chip.lend{background:var(--lend-soft);color:var(--lend);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.skip{background:var(--skip-soft);color:var(--skip);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}

/* progress */
.prog{display:flex;flex-direction:column;gap:8px}
.prog .big{font:800 2.6rem/1 var(--font-d)}
.prog .big small{font:600 1rem var(--font-b);color:var(--muted);margin-left:6px}
.bar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .35s ease}
.bar.thin{height:6px;border:0;background:var(--line)}
.done-badge{display:inline-flex;align-items:center;gap:8px;background:var(--ok-soft);color:var(--ok);font-weight:700;border-radius:999px;padding:6px 14px}

/* checklist rows */
.group-title{display:flex;align-items:baseline;gap:10px;margin:6px 2px 8px}
.group-title .h2{font-size:1.35rem}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.it{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it-main{flex:1;min-width:0;display:flex;align-items:flex-start;gap:14px;padding:13px 6px 13px 14px;background:none;border:0;text-align:left;min-height:56px}
.it-main:active{background:var(--surface-2)}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;margin-top:1px;transition:background .15s,border-color .15s}
.box svg{width:16px;height:16px;opacity:0}
.it.on .box{background:var(--ok);border-color:var(--ok)}
.it.on .box svg{opacity:1}
.it.skip .box{background:var(--skip-soft);border-color:var(--line-2);border-style:dashed}
.it-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.it-name{font-weight:600;line-height:1.35}
.it.on .it-name,.it.skip .it-name{color:var(--muted)}
.it.skip .it-name{text-decoration:line-through}
.it-more{width:52px;flex:none;background:none;border:0;color:var(--muted);font-size:1.3rem;letter-spacing:1px;border-left:1px solid transparent}
.it-more:active{background:var(--surface-2)}
.empty{padding:22px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:1.05rem;margin-bottom:4px}
.note-inline{color:var(--muted);font-size:.88rem;font-style:italic}

/* people */
.person{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.list .person:first-child{border-top:0}
.person:active{background:var(--surface-2)}
.person .t{flex:1;min-width:0}
.person .t b{display:block;font-weight:650}
.person .t span{color:var(--muted);font-size:.86rem}
.person .r{width:92px;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:.82rem;color:var(--muted);font-weight:600}
.person .r .bar{width:100%}

/* needs */
.need-card{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.list .need-card:first-child{border-top:0}
.pair{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;font-size:.92rem}
.pair .k{color:var(--muted);padding-top:3px}

/* cars */
.car{display:flex;flex-direction:column;gap:12px}
.car-route{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.92rem}
.seats{display:flex;flex-wrap:wrap;gap:8px}
.seat{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.88rem;font-weight:600}
.seat .av{width:26px;height:26px;font-size:.72rem}
.seat.free{border-style:dashed;color:var(--faint);background:transparent;padding-left:12px}
.seat.me{border-color:var(--accent)}
.seat .role{color:var(--muted);font-weight:500}
.mycar{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.mycar .muted{color:var(--on-brand-muted)}
.mycar .btn.sec{background:transparent;color:var(--on-brand);border-color:var(--on-brand-muted)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-weight:600;font-size:.92rem}
.field small{color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:10px 14px;font-size:1rem}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--text);box-shadow:0 0 0 3px color-mix(in srgb,var(--text) 15%,transparent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.pw{position:relative}
.pw .input{padding-right:84px}
.pw button{position:absolute;right:6px;top:6px;bottom:6px;border:0;background:var(--surface-2);border-radius:9px;padding:0 12px;font-weight:600;font-size:.85rem;color:var(--muted)}
.linkbox{font-size:.9rem;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:10px;padding:10px 12px;word-break:break-all;user-select:all}
.check-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.check-row:first-child{border-top:0}
.toggle{width:52px;height:32px;border-radius:999px;border:0;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle[aria-checked="true"]{background:var(--ok)}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.toggle.red[aria-checked="true"]{background:var(--need)}
.toggle.blue[aria-checked="true"]{background:var(--lend)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-scrim{position:absolute;inset:0;background:rgba(6,16,11,.5);border:0;animation:fade .18s ease}
.sheet{position:relative;width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow-sheet);
  padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:999px;background:var(--line-2);margin:0 auto 12px}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-head .h2{flex:1}
.x{width:38px;height:38px;border-radius:999px;border:0;background:var(--surface-2);font-size:1.2rem;color:var(--muted);flex:none}
@media (min-width:960px){.sheet-wrap{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
@media (min-width:960px){.toasts{bottom:28px;left:calc(50% + 124px)}}
.toast{pointer-events:auto;background:var(--text);color:var(--surface);padding:11px 18px;border-radius:999px;font-weight:600;font-size:.94rem;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s ease}
.toast.err{background:var(--need);color:#fff}

/* auth */
.auth{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.auth .hero{min-height:200px}
.legend{display:flex;flex-wrap:wrap;gap:12px 18px;color:var(--muted);font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend .mk{width:18px;height:18px}
.thumb{width:100%;max-width:340px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.kv{display:flex;flex-direction:column;gap:4px}
.kv > span:first-child{color:var(--muted);font-size:.85rem;font-weight:600}
.divider{height:1px;background:var(--line);margin:4px 0}

</style>
</head>
<body class="noapp">
<header class="topbar"><div class="in">
  <a class="brand" href="#" data-go="home"><svg class="mk" viewBox="0 0 24 24" aria-hidden="true"><rect class="bg" x="1" y="1" width="22" height="22" rx="4"/><rect class="red" x="2" y="8.5" width="20" height="7"/></svg>XCC</a>

  const route = c => { const parts = [c.from_city && `Din <b>${esc(c.from_city)}</b>`, c.when_text && esc(c.when_text)].filter(Boolean); return parts.length ? `<div class="car-route">${parts.join(", ")}</div>` : ""; };
  const myBlock = mine ? `<div class="block mycar car">
      <div class="block-head"><h2 class="h2">${mine.owner === S.uid ? "Conduci" : `Mergi cu ${esc(firstName(pname(mine.owner)))}`}</h2><span class="muted small">${esc(mine.label || "Mașină")}</span></div>
      ${route(mine)}${seats(mine)}${mine.note ? `<p class="muted small">${esc(mine.note)}</p>` : ""}
      <div class="row">${mine.owner === S.uid ? `<button class="btn sec sm" data-car-edit="${esc(mine.id)}">Editează mașina</button>` : `<button class="btn sec sm" data-leave>Renunț la loc</button>`}</div></div>`
    : `<div class="block stack"><h2 class="h2">Încă n-ai loc</h2>
      <p class="muted">${free ? `Sunt ${plural(free, "loc liber", "locuri libere")}. Alege o mașină de mai jos.` : "Nu sunt locuri libere acum."}</p>
      <div class="row"><button class="btn" data-car-new>Am mașină</button></div></div>`;
  const others = S.cars.filter(c => c.id !== mine?.id);
  return `<h1 class="h1">Transport</h1>${myBlock}
    ${others.length ? `<div class="stack"><div class="group-title"><h2 class="h2">${mine ? "Alte mașini" : "Mașini"}</h2><span class="muted small">${plural(free, "loc liber", "locuri libere")}</span></div>
      ${others.map(c => `<div class="block car">
        <div class="block-head"><h3 class="h3">${esc(c.label || "Mașină")}</h3>${freeOf(c) ? `<span class="chip ok">${plural(freeOf(c), "loc", "locuri")}</span>` : '<span class="chip">Plină</span>'}</div>
        ${route(c)}${seats(c)}${c.note ? `<p class="muted small">${esc(c.note)}</p>` : ""}
        ${(!owned && freeOf(c)) || (isAdmin() && c.owner !== S.uid) ? `<div class="row">${!owned && freeOf(c) ? `<button class="btn ${mine ? "sec" : ""} sm" data-join="${esc(c.id)}">${mine ? "Mută-mă aici" : "Iau un loc"}</button>` : ""}${isAdmin() && c.owner !== S.uid ? `<button class="btn ghost sm" data-car-edit="${esc(c.id)}">Editează (admin)</button>` : ""}</div>` : ""}
      </div>`).join("")}</div>` : (mine ? "" : '<div class="block empty"><b>Nicio mașină încă</b>Cine are mașină o adaugă cu „Am mașină”.</div>')}
    ${!owned && mine ? `<button class="btn ghost" data-car-new>Am și eu mașină</button>` : ""}
    <div class="stack"><div class="group-title"><h2 class="h2">Fără loc</h2><span class="muted small">${waiting.length}</span></div>
      ${waiting.length ? `<div class="chips">${waiting.map(x => `<span class="chip ${x.id === S.uid ? "need" : ""}">${esc(x.name)}</span>`).join("")}</div>` : '<p class="muted">Toată lumea are loc.</p>'}
      ${isAdmin() && people().length && S.cars.length ? `<button class="btn sec sm" data-assign style="align-self:flex-start">Repartizează oamenii</button>` : ""}</div>`;
}

function pageGroup(){
  const t = S.groupTab;
  const seg = `<div class="seg" role="tablist">
    <button role="tab" data-grtab="people" aria-selected="${t === "people"}">Oameni</button>
    <button role="tab" data-grtab="needs" aria-selected="${t === "needs"}">Nevoi</button>
    <button role="tab" data-grtab="items" aria-selected="${t === "items"}">Pe obiect</button></div>`;
  const filter = S.teams.length ? `<div class="chips" role="group" aria-label="Filtrează după echipă">
    ${[["all", "Toți"], ...S.teams.map(x => [x.id, x.name]), ["none", "Fără echipă"]].map(([v, l]) => `<button class="chip" data-team-filter="${esc(v)}" aria-pressed="${S.groupTeam === v}">${esc(l)}</button>`).join("")}</div>` : "";
  let list = people().filter(p => S.groupTeam === "all" || (S.groupTeam === "none" ? !teamOf(p.id) : p.team === S.groupTeam));
  let body;
  if (t === "people"){
    const q = S.q.trim().toLowerCase();
    if (q) list = list.filter(p => p.name.toLowerCase().includes(q));
    const req = reqItems().length;
    body = `<input class="input" type="search" id="q" placeholder="Caută un nume" value="${esc(S.q)}" aria-label="Caută un nume">
      <div class="list">${list.map(p => { const h = req - missingOf(p).length, car = carOf(p.id), tm = teamOf(p.id);
        return `<button class="person" data-person="${esc(p.id)}">${avatar(p)}<span class="t"><b>${esc(p.name)}${p.id === S.uid ? " (tu)" : ""}</b>
          <span>${esc(tm ? tm.name : "Fără echipă")} · ${car ? (car.owner === p.id ? "șofer" : "are loc") : "fără loc"}</span></span>
          <span class="r">${h === req ? '<span class="chip ok">Gata</span>' : `${h}/${req}<span class="bar thin"><i style="width:${req ? h / req * 100 : 0}%"></i></span>`}</span></button>`; }).join("")
        || '<div class="empty">Nimeni aici.</div>'}</div>`;
  } else if (t === "needs"){
    const rows = S.items.map(i => ({ i, need: list.filter(p => st(p, i.id).flag === "need"), lend: list.filter(p => st(p, i.id).flag === "lend") }))
      .filter(r => r.need.length).sort((a, b) => b.need.length - a.need.length);
    body = rows.length ? `<p class="muted">Cine caută ceva și cine are în plus. Vorbiți direct între voi.</p><div class="list">${rows.map(r => `<div class="need-card"><b>${esc(r.i.name)}</b>
        <div class="pair"><span class="k">Caută</span><span class="chips">${r.need.map(p => `<span class="chip need">${esc(p.name)}</span>`).join("")}</span>
        <span class="k">Are în plus</span><span class="chips">${r.lend.length ? r.lend.map(p => `<span class="chip lend">${esc(p.name)}</span>`).join("") : '<span class="muted small">nimeni încă</span>'}</span></div></div>`).join("")}</div>`
      : '<div class="block empty"><b>Nimeni nu caută nimic</b>Când cineva apasă „Am nevoie” la un obiect, apare aici.</div>';
  } else {
    const n = list.length;
    body = n ? `<div class="list">${S.items.map(i => { const h = list.filter(p => has(p, i.id)), miss = list.filter(p => !has(p, i.id) && st(p, i.id).flag !== "skip");
      return `<div class="need-card"><div class="block-head"><b>${esc(i.name)}</b><span class="muted small">${h.length}/${n}</span></div>
        <span class="bar thin"><i style="width:${h.length / n * 100}%"></i></span>
        ${miss.length && miss.length < n ? `<span class="small muted">Nu au bifat: ${esc(miss.map(p => firstName(p.name)).join(", "))}</span>` : ""}</div>`; }).join("")}</div>` : '<div class="block empty">Nimeni aici.</div>';
  }
  return `<h1 class="h1">Echipa</h1>${seg}${filter}${body}`;
}

function pageAdmin(){
  const t = S.adminTab;
  const seg = `<div class="seg tight" role="tablist">
    ${[["requests", "Cereri", pending().length], ["people", "Oameni"], ["teams", "Echipe"], ["list", "Listă"], ["settings", "Setări"]]
      .map(([k, l, n]) => `<button role="tab" data-atab="${k}" aria-selected="${t === k}">${l}${n ? `<span class="n">${n}</span>` : ""}</button>`).join("")}</div>`;
  let body = "";
  if (t === "requests"){
    const invite = `Hai în echipa XCC! Îți faci cont aici și te aprob: ${SITE}`;
    body = `<div class="block stack"><h2 class="h3">Invită oameni</h2>
        <div class="linkbox" id="linkBox">${esc(SITE)}</div>
        <div class="row"><button class="btn sm" data-copy>Copiază linkul</button>
          <a class="btn sec sm" href="https://wa.me/?text=${encodeURIComponent(invite)}" target="_blank" rel="noopener">Trimite pe WhatsApp</a>
          ${navigator.share ? '<button class="btn ghost sm" data-share>Altă aplicație</button>' : ""}</div>
        <p class="small muted">Își fac cont cu nume, email și parolă. Apar aici și nu văd nimic până nu îi aprobi.</p></div>
      ${pending().length ? `<div class="list">${pending().map(p => `<div class="person" style="cursor:default">${avatar(p)}<span class="t"><b>${esc(p.name)}</b><span>s-a înscris ${new Date(p.created_at).toLocaleDateString("ro-RO", { day: "numeric", month: "short" })}</span></span>
          <span class="row" style="flex:none"><button class="btn ok sm" data-approve="${esc(p.id)}">Aprobă</button><button class="btn ghost sm" data-reject="${esc(p.id)}" aria-label="Respinge ${esc(p.name)}">✕</button></span></div>`).join("")}</div>`
        : '<div class="block empty"><b>Nicio cerere nouă</b>Trimite linkul de mai sus și cererile apar aici.</div>'}`;
  }
  if (t === "people"){
    const rej = S.profiles.filter(p => p.status === "rejected");
    body = `<div class="list">${people().map(p => `<button class="person" data-aperson="${esc(p.id)}">${avatar(p)}<span class="t"><b>${esc(p.name)}${p.role === "admin" ? ' <span class="chip">admin</span>' : ""}</b>
        <span>${esc(teamOf(p.id)?.name || "Fără echipă")}</span></span><span class="chev" aria-hidden="true">›</span></button>`).join("")}</div>
      ${rej.length ? `<div class="stack"><h2 class="h3">Respinși</h2><div class="list">${rej.map(p => `<div class="person" style="cursor:default">${avatar(p)}<span class="t"><b>${esc(p.name)}</b></span><button class="btn sec sm" data-approve="${esc(p.id)}">Reprimește</button></div>`).join("")}</div></div>` : ""}`;
  }
  if (t === "teams"){
    const unassigned = people().filter(p => !teamOf(p.id));
    body = `<p class="muted">Creează echipele după ce primiți listele de la 4M, apoi pune oamenii în ele.</p>
      ${S.teams.map(tm => { const mem = people().filter(p => p.team === tm.id);
        return `<div class="block stack"><div class="block-head"><h2 class="h3">${esc(tm.name)}</h2><button class="btn ghost sm" data-team-edit="${esc(tm.id)}">Redenumește</button></div>
          <div class="chips">${mem.map(p => `<span class="chip">${esc(p.name)}</span>`).join("") || '<span class="muted small">Nimeni încă</span>'}</div>
          <button class="btn sec sm" data-team-members="${esc(tm.id)}" style="align-self:flex-start">Alege membrii</button></div>`; }).join("")}
      <form class="row" id="addTeam"><input class="input" id="teamNameNew" placeholder="ex. Echipa 3" maxlength="40" style="flex:1;min-width:0" aria-label="Numele echipei noi"><button class="btn" type="submit">Creează</button></form>
      ${S.teams.length && unassigned.length ? `<p class="small muted">Fără echipă: ${esc(unassigned.map(p => p.name).join(", "))}</p>` : ""}`;
  }
  if (t === "list"){
    const groups = {};
    for (const it of S.items) (groups[isTeam(it) ? "De echipă" : groupOf(it)] ??= []).push(it);
    body = `<div class="row"><button class="btn" data-item-new>Adaugă obiect</button><span class="muted small">Apasă pe un obiect ca să-l modifici.</span></div>
      ${Object.entries(groups).map(([g, l]) => `<section><div class="group-title"><h2 class="h2">${esc(g)}</h2></div>
        <div class="list">${l.map(i => `<button class="person" data-item-edit="${esc(i.id)}"><span class="t"><b>${esc(i.name)}</b><span>${esc(i.cat)}</span></span><span class="chev" aria-hidden="true">›</span></button>`).join("")}</div></section>`).join("")}`;
  }
  if (t === "settings"){
    body = `<div class="block stack"><h2 class="h3">Poza de pe Acasă</h2>
        ${S.cfg.hero_url ? `<img class="thumb" src="${esc(S.cfg.hero_url)}" alt="Poza actuală">` : '<p class="muted small">Acum e ilustrația implicită. Pune o poză de-a voastră din aventură.</p>'}
        <div class="row"><label class="btn sec sm" for="heroFile">Alege o poză</label><input type="file" id="heroFile" accept="image/*" hidden>
          ${S.cfg.hero_url ? '<button class="btn ghost sm" data-hero-clear>Revino la ilustrație</button>' : ""}</div></div>
      <form class="block stack" id="dateForm"><h2 class="h3">Data plecării</h2><p class="muted small">Apare pe Acasă ca numărătoare inversă.</p>
        <div class="row"><input class="input" type="date" id="startDate" value="${esc(S.cfg.start_date || "")}" style="flex:1;min-width:0"><button class="btn sec" type="submit">Salvează</button></div></form>
      <div class="block stack"><h2 class="h3">Golește toate bifele</h2><p class="muted small">Pentru o ediție nouă. Oamenii, mașinile și lista rămân.</p>
        <button class="btn danger sm" data-reset-all style="align-self:flex-start">Golește bifele tuturor</button></div>`;
  }
  return `<h1 class="h1">Admin</h1>${seg}${body}`;
}

/* ---------- sheets ---------- */
function openSheet(kind, data){ S.sheet = { kind, data }; renderSheet(true); }
function closeSheet(){ S.sheet = null; $("sheetWrap").hidden = true; document.body.style.overflow = ""; }
function sheetHtml(){
  const { kind, data } = S.sheet;
  const head = (title, sub) => `<div class="sheet-head"><div style="flex:1"><h2 class="h2">${title}</h2>${sub ? `<p class="muted small" style="margin-top:4px">${sub}</p>` : ""}</div><button class="x" data-close aria-label="Închide">✕</button></div>`;
  if (kind === "item"){
    const it = S.items.find(i => i.id === data); if (!it) return head("Obiect șters");
    const s = st(S.me, it.id), team = isTeam(it);
    const row = (key, label, sub, on, cls) => `<div class="check-row"><span><b>${label}</b>${sub ? `<br><span class="muted small">${sub}</span>` : ""}</span><button class="toggle ${cls || ""}" role="switch" aria-checked="${on}" data-flagset="${key}" aria-label="${label}"></button></div>`;
    return head(esc(it.name), esc(team ? "Echipament de echipă" : groupOf(it))) + `<div>
      ${row("ok", team ? "Îl aduc eu" : "Îl am", "", !!s.ok)}
      ${isOpt(it) ? row("skip", "Nu îl iau", "E opțional, poți să-l lași acasă.", s.flag === "skip") : ""}
      ${team ? "" : row("need", "Am nevoie de el", "Apare la Nevoi, ca să te ajute cineva.", s.flag === "need", "red")}
      ${team ? "" : row("lend", "Pot împrumuta altcuiva", "Am în plus și pot da.", s.flag === "lend", "blue")}</div>
      <form class="stack" id="noteForm" style="margin-top:12px"><label class="field"><span>Notă</span><textarea class="input" id="noteText" maxlength="80" placeholder="ex. am doar unul de 35 L">${esc(s.note || "")}</textarea></label>
      <button class="btn" type="submit">Gata</button></form>`;
  }
  if (kind === "person"){
    const p = byId(data); if (!p) return head("Persoană");
    const miss = missingOf(p), car = carOf(p.id), tm = teamOf(p.id);
    const chipList = (arr, cls) => arr.length ? `<span class="chips">${arr.map(i => `<span class="chip ${cls}">${esc(i.name)}${st(p, i.id).note ? `: ${esc(st(p, i.id).note)}` : ""}</span>`).join("")}</span>` : "";
    const sec = (label, html) => html ? `<div class="kv"><span>${label}</span>${html}</div>` : "";
    const req = reqItems().length;
    return `<div class="sheet-head">${avatar(p, "lg")}<div style="flex:1"><h2 class="h2">${esc(p.name)}</h2><p class="muted small">${esc(tm ? tm.name : "Fără echipă")}</p></div><button class="x" data-close aria-label="Închide">✕</button></div>
      <div class="stack">
        <div class="prog">${miss.length ? `<div class="big">${req - miss.length}<small>din ${req} obligatorii</small></div>` : '<span class="done-badge">✓ Gata de drum</span>'}<div class="bar"><i style="width:${req ? (req - miss.length) / req * 100 : 0}%"></i></div></div>
        ${sec("Îi lipsește", chipList(miss, ""))}
        ${sec("Caută", chipList(S.items.filter(i => st(p, i.id).flag === "need"), "need"))}
        ${sec("Poate împrumuta", chipList(S.items.filter(i => st(p, i.id).flag === "lend"), "lend"))}
        ${sec("Aduce pentru echipă", chipList(teamItems().filter(i => has(p, i.id)), "ok"))}
        ${sec("Transport", car ? `<span>${car.owner === p.id ? "Conduce" : `Merge cu ${esc(pname(car.owner))}`}${car.label ? `, ${esc(car.label)}` : ""}</span>` : '<span class="chip need">Încă fără loc</span>')}
      </div>`;
  }
  if (kind === "car"){
    const c = data || { seats: 3 };
    return head(c.id ? "Mașina" : "Am mașină", c.id ? "" : "Ceilalți își iau loc la tine.") + `<form class="stack" id="carForm">
      <label class="field"><span>Ce mașină</span><input class="input" id="cf-label" value="${esc(c.label || "")}" placeholder="ex. Duster gri" maxlength="40"></label>
      <label class="field"><span>Locuri pentru pasageri</span><input class="input" type="number" inputmode="numeric" id="cf-seats" min="0" max="8" value="${esc(c.seats ?? 3)}"><small>Fără tine, șoferul.</small></label>
      <div class="grid2"><label class="field"><span>Pleci din</span><input class="input" id="cf-from" value="${esc(c.from_city || "")}" placeholder="ex. Oradea" maxlength="40"></label>
        <label class="field"><span>Când</span><input class="input" id="cf-when" value="${esc(c.when_text || "")}" placeholder="ex. joi la 14" maxlength="40"></label></div>
      <label class="field"><span>Notă</span><input class="input" id="cf-note" value="${esc(c.note || "")}" placeholder="ex. am loc de rucsaci mari" maxlength="80"></label>
      <button class="btn" type="submit">${c.id ? "Salvează" : "Adaugă mașina"}</button>
      ${c.id ? `<button class="btn danger" type="button" data-car-del="${esc(c.id)}">Șterge mașina</button>` : ""}</form>`;
  }
  if (kind === "assign"){
    return head("Repartizează", "Alege mașina fiecăruia.") + `<div>${people().map(p => `<div class="check-row"><span>${esc(p.name)}</span>
      <select class="input" style="max-width:190px" data-assign-sel="${esc(p.id)}" aria-label="Mașina lui ${esc(p.name)}"><option value="">Fără loc</option>
      ${S.cars.map(c => `<option value="${esc(c.id)}" ${p.ride === c.id ? "selected" : ""}>${esc(firstName(pname(c.owner)))} · ${esc(c.label || "mașină")}</option>`).join("")}</select></div>`).join("")}</div>`;
  }
  if (kind === "profile"){
    return `<div class="sheet-head">${avatar(S.me, "lg")}<div style="flex:1"><h2 class="h2">${esc(S.me?.name)}</h2><p class="muted small">${esc(S.email)}</p></div><button class="x" data-close aria-label="Închide">✕</button></div>
      <form class="stack" id="nameForm"><label class="field"><span>Numele afișat</span><input class="input" id="pn" value="${esc(S.me?.name || "")}" maxlength="30" autocomplete="name"></label><button class="btn sec" type="submit">Salvează numele</button></form>
      <div class="divider" style="margin:16px 0"></div>
      <form class="stack" id="passForm"><label class="field"><span>Parolă nouă</span><div class="pw"><input class="input" type="password" id="pp" minlength="8" autocomplete="new-password"><button type="button" data-pw>Arată</button></div></label><button class="btn sec" type="submit">Schimbă parola</button></form>
      <div class="divider" style="margin:16px 0"></div>
      <button class="btn ghost block-w" data-logout>Ieși din cont</button>`;
  }
  if (kind === "aperson"){
    const p = byId(data); if (!p) return head("Persoană");
    const self = p.id === S.uid;
    return `<div class="sheet-head">${avatar(p, "lg")}<div style="flex:1"><h2 class="h2">${esc(p.name)}</h2><p class="muted small">${p.role === "admin" ? "Admin" : "Membru"}</p></div><button class="x" data-close aria-label="Închide">✕</button></div>
      <div class="stack"><label class="field"><span>Echipa</span><select class="input" data-ateam="${esc(p.id)}"><option value="">Fără echipă</option>${S.teams.map(t => `<option value="${esc(t.id)}" ${p.team === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select></label>
      ${self ? "" : `<div class="check-row"><span><b>Admin</b><br><span class="muted small">Poate aproba oameni și modifica lista.</span></span><button class="toggle" role="switch" aria-checked="${p.role === "admin"}" data-arole="${esc(p.id)}" aria-label="Admin"></button></div>`}
      <button class="btn sec" data-aview="${esc(p.id)}">Vezi ce are bifat</button>
      <button class="btn danger" data-areset="${esc(p.id)}">Golește bifele</button>
      ${self ? "" : `<button class="btn danger" data-reject="${esc(p.id)}">Scoate din grup</button>`}</div>`;
  }
  if (kind === "team-edit"){
    const tm = S.teams.find(x => x.id === data); if (!tm) return head("Echipă");
    return head("Redenumește echipa") + `<form class="stack" id="teamForm"><label class="field"><span>Nume</span><input class="input" id="tn" value="${esc(tm.name)}" maxlength="40"></label>
      <button class="btn" type="submit">Salvează</button><button class="btn danger" type="button" data-team-del="${esc(tm.id)}">Șterge echipa</button>
      <p class="small muted">Dacă o ștergi, membrii rămân fără echipă.</p></form>`;
  }
  if (kind === "team-members"){
    const tm = S.teams.find(x => x.id === data); if (!tm) return head("Echipă");
    return head(esc(tm.name), "Bifează cine e în echipă.") + `<div>${people().map(p => { const other = p.team && p.team !== tm.id ? S.teams.find(x => x.id === p.team) : null;
      return `<div class="check-row"><span><b>${esc(p.name)}</b>${other ? `<br><span class="muted small">acum în ${esc(other.name)}</span>` : ""}</span>
        <button class="toggle" role="switch" aria-checked="${p.team === tm.id}" data-member="${esc(p.id)}" data-tid="${esc(tm.id)}" aria-label="${esc(p.name)} în ${esc(tm.name)}"></button></div>`; }).join("")}</div>`;
  }
  if (kind === "item-edit"){
    const it = data ? S.items.find(i => i.id === data) : null;
    const cats = [...new Set(["Personal obligatoriu", "Îmbrăcăminte obligatoriu", "Dormit obligatoriu", "Masă obligatoriu", "Echipă obligatoriu", "Opțional", "Echipă opțional", ...S.items.map(i => i.cat)])];
    return head(it ? "Modifică obiectul" : "Obiect nou") + `<form class="stack" id="itemForm" data-id="${esc(it?.id || "")}">
      <label class="field"><span>Nume</span><input class="input" id="in" value="${esc(it?.name || "")}" maxlength="60" required></label>
      <label class="field"><span>Unde apare</span><select class="input" id="ic">${cats.map(c => `<option ${c === (it?.cat || "Personal obligatoriu") ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
        <small>„Echipă …” înseamnă unul pe echipă. „Opțional” se poate lăsa acasă.</small></label>
      <button class="btn" type="submit">${it ? "Salvează" : "Adaugă"}</button>
      ${it ? `<button class="btn danger" type="button" data-item-del="${esc(it.id)}">Șterge obiectul</button>` : ""}</form>`;
  }
  return "";
}
function renderSheet(first){
  if (!S.sheet) return;
  const a = document.activeElement;
  if (!first && a && $("sheetBody").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  $("sheetBody").innerHTML = `<div class="grab" aria-hidden="true"></div>` + sheetHtml();
  $("sheetWrap").hidden = false; document.body.style.overflow = "hidden";
  if (first) setTimeout(() => $("sheetBody").querySelector(".x")?.focus(), 30);
}

/* ---------- render ---------- */
function navBadges(){ return { gear: missingOf(S.me).length || "", transport: carOf(S.uid) ? "" : "!", admin: pending().length || "" }; }
function renderChrome(inApp){
  document.body.classList.toggle("noapp", !inApp);
  if (!inApp){ $("rail").innerHTML = ""; $("tabbar").innerHTML = ""; return; }
  const b = navBadges();
  const items = [["home", "Acasă", "band"], ["gear", "Echipament", "dot"], ["transport", "Transport", "cross"], ["group", "Echipa", "tri"]];
  if (isAdmin()) items.push(["admin", "Admin", "gear"]);
  $("tabbar").innerHTML = items.map(([k, l, m]) => `<button class="tab" data-go="${k}" ${S.page === k ? 'aria-current="page"' : ""}>${marker(m)}${l}${b[k] ? `<span class="dot">${b[k]}</span>` : ""}</button>`).join("");
  $("rail").innerHTML = `<a class="brand" href="#" data-go="home">${marker("band")}XCC <small>echipa noastră</small></a>`
    + items.map(([k, l, m]) => `<button class="nav" data-go="${k}" ${S.page === k ? 'aria-current="page"' : ""}>${marker(m)}${l}${b[k] ? `<span class="dot">${b[k]}</span>` : ""}</button>`).join("")
    + `<button class="me" data-profile>${avatar(S.me)}<span>${esc(S.me.name)}<small>Contul meu</small></span></button>`;
  $("avatarBtn").innerHTML = avatar(S.me);
}
function render(){
  const inApp = !!(S.uid && approved() && !S.recovering);
  renderChrome(inApp);
  let html;
  if (!S.loaded) html = '<div class="block empty">Se încarcă…</div>';
  else if (!S.uid || S.recovering) html = pageAuth();
  else if (!S.me) html = '<div class="block empty">Îți pregătim contul…</div>';
  else if (!approved()) html = pagePending();
  else {
    if (S.page === "admin" && !isAdmin()) S.page = "home";
    html = { home: pageHome, gear: pageGear, transport: pageTransport, group: pageGroup, admin: pageAdmin }[S.page]();
  }
  const a = document.activeElement, keepQ = a?.id === "q" ? a.selectionStart : null;
  $("page").innerHTML = html;
  if (keepQ !== null && $("q")){ $("q").focus(); $("q").setSelectionRange(keepQ, keepQ); }
  if (S.sheet) renderSheet(false);
}

/* ---------- writes ---------- */
function setItem(itemId, patch){
  if (!S.me) return;
  const cur = { ok: false, flag: "", note: "", ...st(S.me, itemId), ...patch };
  S.me.items = { ...(S.me.items || {}), [itemId]: cur };
  render();
  return write(() => sb.rpc("set_item", { item_id: itemId, val: cur }));
}
const upd = (id, v, msg) => write(() => sb.from("profiles").update(v).eq("id", id), msg);
const setRide = (uid, carId, msg) => write(() => sb.from("profiles").update({ ride: carId || null }).eq("id", uid), msg);

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target, q = sel => t.closest(sel);
  let b;
  if ((b = q("[data-go]"))){ e.preventDefault(); const tab = b.dataset.tab; go(b.dataset.go, tab ? (b.dataset.go === "admin" ? { adminTab: tab } : { gearTab: tab }) : {}); return; }
  if (q("[data-close]") || t.classList.contains("sheet-scrim")){ closeSheet(); return; }
  if ((b = q("[data-auth]"))){ S.authMode = b.dataset.auth; render(); return; }
  if ((b = q("[data-pw]"))){ const i = b.parentElement.querySelector("input"); i.type = i.type === "password" ? "text" : "password"; b.textContent = i.type === "password" ? "Arată" : "Ascunde"; return; }
  if (q("[data-logout]")){ closeSheet(); await sb.auth.signOut(); return; }
  if (q("[data-profile]") || q("#avatarBtn")){ openSheet("profile"); return; }
  if ((b = q("[data-gtab]"))){ S.gearTab = b.dataset.gtab; render(); return; }
  if ((b = q("[data-grtab]"))){ S.groupTab = b.dataset.grtab; render(); return; }
  if ((b = q("[data-atab]"))){ S.adminTab = b.dataset.atab; render(); return; }
  if (q("[data-missing]")){ S.onlyMissing = !S.onlyMissing; render(); return; }
  if ((b = q("[data-team-filter]"))){ S.groupTeam = b.dataset.teamFilter; render(); return; }
  if ((b = q("[data-toggle]"))){
    const id = b.dataset.toggle, s = st(S.me, id), on = !s.ok;
    setItem(id, on && s.flag === "skip" ? { ok: true, flag: "" } : on && s.flag === "need" ? { ok: true, flag: "" } : { ok: on });
    if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
    return;
  }
  if ((b = q("[data-more]"))){ openSheet("item", b.dataset.more); return; }
  if ((b = q("[data-flagset]"))){
    const id = S.sheet?.data, key = b.dataset.flagset, s = st(S.me, id), on = b.getAttribute("aria-checked") !== "true";
    if (key === "ok") setItem(id, on ? { ok: true, flag: s.flag === "skip" || s.flag === "need" ? "" : s.flag } : { ok: false });
    else setItem(id, on ? { flag: key, ...(key === "skip" || key === "need" ? { ok: false } : {}) } : { flag: "" });
    return;
  }
  if ((b = q("[data-person]"))){ openSheet("person", b.dataset.person); return; }
  if ((b = q("[data-aview]"))){ openSheet("person", b.dataset.aview); return; }
  // transport
  if (q("[data-car-new]")){ openSheet("car", null); return; }
  if ((b = q("[data-car-edit]"))){ openSheet("car", { ...S.cars.find(c => c.id === b.dataset.carEdit) }); return; }
  if ((b = q("[data-join]"))){ await setRide(S.uid, b.dataset.join, "Ți-ai luat loc"); return; }
  if (q("[data-leave]")){ await setRide(S.uid, null, "Ai renunțat la loc"); return; }
  if ((b = q("[data-car-del]"))){ if (!arm(b)) return; if (await write(() => sb.from("cars").delete().eq("id", b.dataset.carDel), "Mașina a fost ștearsă")) closeSheet(); return; }
  if (q("[data-assign]")){ openSheet("assign"); return; }
  // admin
  if (q("[data-copy]")){
    try { await navigator.clipboard.writeText(SITE); toast("Link copiat"); }
    catch { const r = document.createRange(); r.selectNodeContents($("linkBox")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Linkul e selectat, copiază-l"); }
    return;
  }
  if (q("[data-share]")){ try { await navigator.share({ title: "XCC", text: "Hai în echipa XCC! Îți faci cont și te aprob:", url: SITE }); } catch {} return; }
  if ((b = q("[data-approve]"))){ const p = byId(b.dataset.approve); await upd(b.dataset.approve, { status: "approved" }, `${firstName(p?.name)} e în grup`); return; }
  if ((b = q("[data-reject]"))){ if (!arm(b, "Sigur?")) return; await upd(b.dataset.reject, { status: "rejected", ride: null }, "Gata"); closeSheet(); return; }
  if ((b = q("[data-aperson]"))){ openSheet("aperson", b.dataset.aperson); return; }
  if ((b = q("[data-arole]"))){ const on = b.getAttribute("aria-checked") !== "true"; await upd(b.dataset.arole, { role: on ? "admin" : "member" }, on ? "E admin acum" : "Nu mai e admin"); return; }
  if ((b = q("[data-areset]"))){ if (!arm(b)) return; await upd(b.dataset.areset, { items: {} }, "Bifele au fost golite"); return; }
  if ((b = q("[data-team-edit]"))){ openSheet("team-edit", b.dataset.teamEdit); return; }
  if ((b = q("[data-team-members]"))){ openSheet("team-members", b.dataset.teamMembers); return; }
  if ((b = q("[data-member]"))){ const on = b.getAttribute("aria-checked") !== "true"; b.setAttribute("aria-checked", on); await upd(b.dataset.member, { team: on ? b.dataset.tid : null }); return; }
  if ((b = q("[data-team-del]"))){ if (!arm(b)) return; if (await write(() => sb.from("teams").delete().eq("id", b.dataset.teamDel), "Echipa a fost ștearsă")) closeSheet(); return; }
  if (q("[data-item-new]")){ openSheet("item-edit", null); return; }
  if ((b = q("[data-item-edit]"))){ openSheet("item-edit", b.dataset.itemEdit); return; }
  if ((b = q("[data-item-del]"))){ if (!arm(b)) return; if (await write(() => sb.from("items").delete().eq("id", b.dataset.itemDel), "Obiectul a fost șters")) closeSheet(); return; }
  if ((b = q("[data-hero-clear]"))){ if (!arm(b)) return; await write(() => sb.from("config").update({ hero_url: "" }).eq("id", 1), "Ilustrația e înapoi"); return; }
  if ((b = q("[data-reset-all]"))){ if (!arm(b, "Sigur? Se golesc bifele tuturor")) return; for (const p of people()) await upd(p.id, { items: {} }); toast("Bifele tuturor au fost golite"); return; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet) closeSheet(); });
document.addEventListener("input", e => { if (e.target.id === "q"){ S.q = e.target.value; render(); } });
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.assignSel !== undefined){ await setRide(t.dataset.assignSel, t.value, "Salvat"); return; }
  if (t.dataset.ateam !== undefined){ await upd(t.dataset.ateam, { team: t.value || null }, "Echipa a fost schimbată"); return; }
  if (t.id === "heroFile" && t.files?.[0]){
    const f = t.files[0];
    if (f.size > 8e6){ toast("Poza e prea mare. Maxim 8 MB.", true); return; }
    toast("Se încarcă poza…");
    const ext = (f.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
    const path = `hero-${Date.now()}.${ext}`;
    const up = await sb.storage.from("media").upload(path, f, { contentType: f.type, upsert: false });
    if (up.error){ toast("Poza nu s-a încărcat. Încearcă un JPG sau PNG.", true); return; }
    const url = sb.storage.from("media").getPublicUrl(path).data.publicUrl;
    await write(() => sb.from("config").update({ hero_url: url }).eq("id", 1), "Poza e pe Acasă");
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const id = e.target.id, v = x => $(x).value.trim();
  if (id === "loginForm"){
    const r = await sb.auth.signInWithPassword({ email: v("le"), password: $("lp").value });
    if (r.error) toast(/confirm/i.test(r.error.message) ? "Confirmă întâi emailul din mesajul primit." : "Email sau parolă greșită.", true);
  }
  if (id === "signupForm"){
    if ($("sp").value.length < 8){ toast("Parola trebuie să aibă minim 8 caractere.", true); return; }
    const r = await sb.auth.signUp({ email: v("se"), password: $("sp").value, options: { data: { name: v("sn") }, emailRedirectTo: SITE } });
    if (r.error) toast(/registered|exists/i.test(r.error.message) ? "Ai deja cont cu acest email. Apasă „Am cont”." : "Contul nu s-a creat: " + r.error.message, true);
    else if (!r.data.session) toast("Ți-am trimis un email de confirmare. Apasă linkul din el, apoi intră.");
  }
  if (id === "forgotForm"){
    const r = await sb.auth.resetPasswordForEmail(v("fe"), { redirectTo: SITE });
    toast(r.error ? "Emailul nu s-a trimis. Încearcă mai târziu." : "Dacă ai cont, ai primit un link pe email.", !!r.error);
  }
  if (id === "newPassForm" || id === "passForm"){
    const pw = $(id === "newPassForm" ? "np" : "pp").value;
    if (pw.length < 8){ toast("Parola trebuie să aibă minim 8 caractere.", true); return; }
    const r = await sb.auth.updateUser({ password: pw });
    if (r.error) toast("Parola nu s-a schimbat: " + r.error.message, true);
    else { S.recovering = false; closeSheet(); toast("Parola a fost schimbată"); render(); }
  }
  if (id === "nameForm"){ if (v("pn")) await upd(S.uid, { name: v("pn") }, "Numele a fost salvat"); closeSheet(); }
  if (id === "noteForm"){ const itId = S.sheet?.data; const n = v("noteText"); if (n !== (st(S.me, itId).note || "")) setItem(itId, { note: n }); closeSheet(); }
  if (id === "carForm"){
    const c = S.sheet?.data;
    const data = { label: v("cf-label"), seats: Math.max(0, Math.min(8, parseInt($("cf-seats").value) || 0)), from_city: v("cf-from"), when_text: v("cf-when"), note: v("cf-note") };
    if (c?.id){ if (await write(() => sb.from("cars").update(data).eq("id", c.id), "Mașina a fost salvată")) closeSheet(); }
    else {
      const r = await write(() => sb.from("cars").insert({ ...data, owner: S.uid }).select().single());
      if (r?.data){ await setRide(S.uid, r.data.id, "Mașina ta e pe listă"); closeSheet(); }
    }
  }
  if (id === "addTeam"){ const n = v("teamNameNew"); if (n) await write(() => sb.from("teams").insert({ name: n }), `${n} a fost creată`); }
  if (id === "teamForm"){ const n = v("tn"); if (n && await write(() => sb.from("teams").update({ name: n }).eq("id", S.sheet.data), "Salvat")) closeSheet(); }
  if (id === "dateForm"){ await write(() => sb.from("config").update({ start_date: $("startDate").value || null }).eq("id", 1), "Data a fost salvată"); }
  if (id === "itemForm"){
    const itId = e.target.dataset.id, name = v("in"), cat = $("ic").value;
    if (!name) return;
    const ok = itId ? await write(() => sb.from("items").update({ name, cat }).eq("id", itId), "Salvat")
      : await write(() => sb.from("items").insert({ id: "x" + Date.now().toString(36), name, cat, ord: Math.max(0, ...S.items.map(i => Number(i.ord) || 0)) + 1 }), `${name} e pe listă`);
    if (ok) closeSheet();
  }
});

/* ---------- boot ---------- */
(function(){ const h = (location.hash || "").slice(1); if (PAGES.includes(h)) S.page = h; })();
render();
sb.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") S.recovering = true;
  const uid = session?.user?.id || null;
  S.email = session?.user?.email || "";
  if (uid !== S.uid){ S.uid = uid; S.me = null; S.profiles = []; if (uid) subscribe(); }
  setTimeout(loadAll, 0);
});

</script>
</body>
</html>
