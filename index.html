  if ((b = q("[data-reject]"))){
    const p = byId(b.dataset.reject); if (!arm(b, "Apasă încă o dată ca să confirmi")) return;
    const car = S.cars.find(c => c.owner === p?.id);
    if (car) await write(() => sb.from("cars").delete().eq("id", car.id));
    await upd(b.dataset.reject, { status: "rejected", ride: null, team: null }, `${firstName(p?.name)} nu mai e în grup`); closeSheet(); return;
  }
  if ((b = q("[data-aperson]"))){ openSheet("aperson", b.dataset.aperson); return; }
  if ((b = q("[data-arole]"))){ const on = b.getAttribute("aria-checked") !== "true"; if (!arm(b, on ? "Apasă încă o dată: îl faci admin" : "Apasă încă o dată: nu mai e admin")) return; await upd(b.dataset.arole, { role: on ? "admin" : "member" }, on ? "E admin acum" : "Nu mai e admin"); return; }
  if ((b = q("[data-areset]"))){ if (!arm(b)) return; await upd(b.dataset.areset, { items: {} }, "Bifele lui au fost golite"); return; }
  if ((b = q("[data-setteam]"))){ const pid = b.dataset.setteam, tid = b.dataset.tid || null, p = byId(pid); if (p) p.team = tid; render(); await upd(pid, { team: tid }, tid ? `${shortName(p)} e în ${S.teams.find(x => x.id === tid)?.name}` : `${shortName(p)} e fără echipă`); return; }
  if ((b = q("[data-team-edit]"))){ openSheet("team-edit", b.dataset.teamEdit); return; }

  if ((b = q("[data-reset-all]"))){
    if (!arm(b, "Sigur? Apasă încă o dată: se golesc bifele tuturor")) return;
    await busy(b, async () => { let fail = 0; for (const p of people()){ const r = await sb.from("profiles").update({ items: {} }).eq("id", p.id); if (r.error) fail++; } toast(fail ? `${fail} n-au reușit. Încearcă din nou.` : "Bifele tuturor au fost golite", !!fail); scheduleReload(100); });

  if (e.target.id === "listQ"){ S.listQ = e.target.value; render(); }
});
document.addEventListener("focusout", e => { if (e.target.id === "noteText") saveNoteDraft(); });
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.assignSel !== undefined){ await setRide(t.dataset.assignSel, t.value, "Salvat"); return; }
  if (t.id === "heroFile" && t.files?.[0]){
    const f = t.files[0];
    if (f.size > 8e6){ toast("Poza e prea mare. Maxim 8 MB.", true); return; }
    toast("Se încarcă poza…");
    const ext = (f.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
    const path = `hero-${Date.now()}.${ext}`;
    const up = await sb.storage.from("media").upload(path, f, { contentType: f.type, upsert: false });
    if (up.error){ toast("Poza nu s-a încărcat. Încearcă un JPG sau PNG.", true); return; }
    const url = sb.storage.from("media").getPublicUrl(path).data.publicUrl;
    await write(() => sb.from("config").update({ hero_url: url }).eq("id", 1), "Poza e pe Acasă");
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const id = e.target.id, v = x => $(x).value.trim(), btn = e.submitter || e.target.querySelector('[type="submit"]');
  await busy(btn, async () => {
    if (id === "loginForm"){
      const r = await sb.auth.signInWithPassword({ email: v("le"), password: $("lp").value });
      if (r.error) toast(/confirm/i.test(r.error.message) ? "Confirmă întâi emailul din mesajul primit." : /invalid|credentials/i.test(r.error.message) ? "Email sau parolă greșită. Ai uitat parola? Apasă „Am uitat parola”." : authErr(r.error.message), true);
    }
    if (id === "signupForm"){
      if ($("sp").value.length < 8){ toast("Parola trebuie să aibă minim 8 caractere.", true); return; }
      const email = v("se");
      const r = await sb.auth.signUp({ email, password: $("sp").value, options: { data: { name: v("sn") }, emailRedirectTo: SITE } });
      if (r.error) toast(/registered|exists/i.test(r.error.message) ? "Ai deja cont cu acest email. Apasă „Am cont”." : authErr(r.error.message), true);
      else if (r.data?.user && Array.isArray(r.data.user.identities) && r.data.user.identities.length === 0){ S.checkEmail = email; S.authMode = "login"; render(); toast("Ai deja cont cu acest email. Intră sau apasă „Am uitat parola”.", true); }
      else if (!r.data?.session){ S.checkEmail = email; S.authMode = "check"; render(); }
    }
    if (id === "forgotForm"){
      const email = v("fe");
      const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE });
      if (r.error) toast(authErr(r.error.message), true);
      else { S.checkEmail = email; S.authMode = "sent"; render(); }
    }
    if (id === "newPassForm" || id === "passForm"){
      const pw = $(id === "newPassForm" ? "np" : "pp").value;
      if (pw.length < 8){ toast("Parola trebuie să aibă minim 8 caractere.", true); return; }
      const r = await sb.auth.updateUser({ password: pw });
      if (r.error) toast(authErr(r.error.message), true);
      else { S.recovering = false; closeSheet(); toast("Parola a fost schimbată"); try { history.replaceState(null, "", SITE); } catch {} loadAll(); }
    }
    if (id === "nameForm"){
      const n = v("pn"); if (!n){ toast("Scrie un nume.", true); return; }
      if (await upd(S.uid, { name: n }, "Nume salvat")) closeSheet();
    }
    if (id === "carForm"){
      const c = S.sheet?.data;
      const data = { seats: Math.max(0, Math.min(8, Number($("cf-seats").textContent) || 0)), from_city: v("cf-from"), when_text: v("cf-when"), note: v("cf-note") };
      if (c?.id){ if (await write(() => sb.from("cars").update(data).eq("id", c.id), "Mașina a fost salvată")) closeSheet(); }
      else {
        const r = await write(() => sb.from("cars").insert({ ...data, owner: S.uid }).select().single());
        if (r?.data){ await upd(S.uid, { ride: r.data.id, own_transport: false }, "Mașina ta e pe listă"); closeSheet(); }
      }
    }
    if (id === "addTeam"){ const n = v("teamNameNew"); if (n && await write(() => sb.from("teams").insert({ name: n }), `${n} a fost creată`)) $("teamNameNew").value = ""; }
    if (id === "teamForm"){ const n = v("tn"); if (n && await write(() => sb.from("teams").update({ name: n }).eq("id", S.sheet.data), "Salvat")) closeSheet(); }
    if (id === "dateForm"){ await write(() => sb.from("config").update({ start_date: $("startDate").value || null }).eq("id", 1), "Data a fost salvată"); }
    if (id === "itemForm"){
      const itId = e.target.dataset.id, name = v("in"), cat = $("ic").value;
      if (!name) return;
      const ok = itId ? await write(() => sb.from("items").update({ name, cat }).eq("id", itId), "Salvat")
        : await write(() => sb.from("items").insert({ id: "x" + Date.now().toString(36), name, cat, ord: Math.max(0, ...S.items.map(i => Number(i.ord) || 0)) + 1 }), `${name} e pe listă`);
      if (ok) closeSheet();
    }
  });
});

/* ---------- boot ---------- */
readHash();
render();
sb.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") S.recovering = true;
  const uid = session?.user?.id || null;
  S.email = session?.user?.email || "";
  if (uid !== S.uid){ S.uid = uid; S.me = null; S.profiles = []; S.meMissing = 0; if (uid) subscribe(); }
  setTimeout(loadAll, 0);
});

</script>
</body>
</html>
