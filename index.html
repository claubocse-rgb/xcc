<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>XCC</title>
<meta name="description" content="Echipament, transport și echipe pentru Xtreme Character Challenge.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='4' fill='white' stroke='%23ccc'/%3E%3Crect x='2' y='8.5' width='20' height='7' fill='%23D0161E'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='white'/%3E%3Crect y='8' width='24' height='8' fill='%23D0161E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* XCC — trail-marker field app in 4M colours.
   Black chrome, neutral white/grey ground. Red = brand (markers, active nav, primary button) and alarm
   (missing / need). Ink = done & progress. Blue = extra to give. Green only for "fully ready".
   Phone: black top bar + bottom tab bar. Desktop (>=960px): black left rail + content column. */
:root{
  --bg:#F3F3F3; --surface:#FFFFFF; --surface-2:#F6F6F6; --line:#DCDCDC; --line-2:#C4C4C4; --ctrl:#8A8A8A;
  --text:#111111; --muted:#555555; --faint:#6B6B6B;
  --brand:#000000; --brand-2:#1C1C1C; --on-brand:#FFFFFF; --on-brand-muted:#A3A3A3;
  --accent:#CF171F; --accent-press:#A8121A; --on-accent:#FFFFFF;
  --ok:#111111; --ok-soft:#ECECEC; --ready:#1F6F43; --ready-soft:#E3F1E8;
  --need:#B4141B; --need-strong:#B4141B; --need-soft:#FDE7E8; --lend:#1D4E89; --lend-soft:#E6EEF8;
  --skip:#666666; --skip-soft:#F0F0F0; --warn:#8A5300; --warn-soft:#FBEBCD;
  --seg-on:#FFFFFF;
  --marker-bg:#FFFFFF; --marker-edge:#C4C4C4; --marker-red:#CF171F;
  --shadow-sheet:0 -12px 40px rgba(0,0,0,.22);
  --font-d:"Big Shoulders Display","Big Shoulders","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --font-b:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-s:6px; --r-m:10px; --r-l:12px;
  --tabbar-h:64px; --topbar-h:56px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C0C0D; --surface:#17171A; --surface-2:#1F1F23; --line:#33333A; --line-2:#5A5A63; --ctrl:#7A7A84;
  --text:#F4F4F5; --muted:#A1A1AA; --faint:#8B8B94;
  --brand:#000000; --brand-2:#1C1C1E; --on-brand:#FFFFFF; --on-brand-muted:#A1A1AA;
  --accent:#E5252C; --accent-press:#CF171F; --on-accent:#FFFFFF;
  --ok:#F4F4F5; --ok-soft:#27272A; --ready:#5CC48A; --ready-soft:#16301F;
  --need:#FF6B70; --need-strong:#C81A21; --need-soft:#3A1415; --lend:#8AB4F0; --lend-soft:#15233A;
  --skip:#A1A1AA; --skip-soft:#232326; --warn:#F2B65C; --warn-soft:#3A2B12;
  --seg-on:#34343A;
  --marker-bg:#E8E8EA; --marker-edge:transparent; --marker-red:#CF171F;
  --shadow-sheet:0 -12px 40px rgba(0,0,0,.6),0 -1px 0 #3A3A42;
  color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.5 var(--font-b);-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--lend)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,.prog .big,.person .r,.count-pill b,.dot,.seg .n,.count{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- trail markers ---------- */
.mk{width:24px;height:24px;flex:none;display:block}
.mk rect.bg{fill:var(--marker-bg);stroke:var(--marker-edge)}
.mk .red{fill:var(--marker-red)}
.mk .ink{fill:#111}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--brand);color:var(--on-brand);padding:env(safe-area-inset-top,0px) 16px 0}
@media (prefers-color-scheme:dark){.topbar{box-shadow:0 1px 0 var(--line)}}
.topbar .in{height:var(--topbar-h);display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font:800 1.5rem/1 var(--font-d);letter-spacing:.03em}
.avatar-btn{margin-left:auto;background:none;border:0;padding:5px;border-radius:999px;min-width:44px;min-height:44px}
.av{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;font:700 .82rem var(--font-b);color:#fff;flex:none}
.av.lg{width:52px;height:52px;font-size:1.05rem}
.shell{max-width:760px;margin:0 auto;padding:18px 16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  padding:0 4px env(safe-area-inset-bottom,0px);display:flex;justify-content:space-around}
.tab{flex:1;max-width:120px;height:var(--tabbar-h);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted);font:600 .74rem var(--font-b);position:relative}
.tab .ic{position:relative;display:block}
.tab:not([aria-current="page"]) .mk{opacity:.8}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .dot{position:absolute;top:-7px;left:15px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font:700 .66rem/18px var(--font-b);box-shadow:0 0 0 2px var(--surface);text-align:center}
.rail{display:none}
body.noapp .tabbar,body.noapp .avatar-btn{display:none}

@media (min-width:960px){
  .topbar{display:none}
  body:not(.noapp) .rail{display:flex;position:fixed;inset:0 auto 0 0;width:248px;flex-direction:column;background:var(--brand);color:var(--on-brand);padding:22px 14px;gap:4px;z-index:40;border-right:1px solid var(--brand-2)}
  .rail .brand{padding:0 8px 18px}
  .rail .nav{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--on-brand-muted);font:600 .98rem var(--font-b);padding:11px 10px;border-radius:8px;text-align:left}
  .rail .nav:hover{background:var(--brand-2);color:var(--on-brand)}
  .rail .nav[aria-current="page"]{background:var(--brand-2);color:var(--on-brand);box-shadow:inset 3px 0 0 var(--accent)}
  .rail .nav .dot{margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;font:700 .72rem/20px var(--font-b);min-width:20px;padding:0 6px;text-align:center}
  .rail .me{margin-top:auto;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--on-brand);padding:10px;border-radius:8px;text-align:left}
  .rail .me:hover{background:var(--brand-2)}
  .rail .me span small{display:block;color:var(--on-brand-muted);font-size:.8rem}
  .tabbar{display:none}
  body:not(.noapp) .shell{margin-left:248px;max-width:none;padding:34px 48px 60px}
  body:not(.noapp) .page{max-width:760px;margin:0 auto}
  body.noapp .topbar{display:block}
  body.noapp .shell{margin:0 auto}
  :root{--topbar-h:0px}
}
.page{display:flex;flex-direction:column;gap:20px}

/* ---------- type ---------- */
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font:800 clamp(2.5rem,10vw,3.3rem)/.95 var(--font-d);letter-spacing:.005em}
.h2{font:800 1.8rem/1.05 var(--font-d);letter-spacing:.01em}
.h3{font:700 1.05rem/1.3 var(--font-b)}
.lead{margin:0;color:var(--muted);max-width:60ch}
.muted{color:var(--muted)}
.small{font-size:.875rem}
p{margin:0}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:var(--r-l);overflow:hidden;min-height:clamp(210px,44vw,320px);background:#111;color:#fff;display:flex;align-items:flex-end;isolation:isolate}
.hero > img,.hero > svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;z-index:-2}
.hero > img{object-position:right top}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.3) 0%,rgba(0,0,0,.28) 38%,rgba(0,0,0,.86) 100%)}
.hero h1,.hero p{text-shadow:0 2px 14px rgba(0,0,0,.4)}
.hero .txt{padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.hero h1{font:900 clamp(2.5rem,11vw,4.2rem)/.86 var(--font-d);letter-spacing:.01em;text-transform:uppercase}
.hero p{color:#ECECEC;font-weight:600}
.count-pill{align-self:flex-start;display:inline-flex;align-items:baseline;gap:6px;background:#FFFFFF;color:#111;border-radius:var(--r-s);padding:4px 12px 4px 4px;font-weight:600;font-size:.9rem}
.count-pill b{background:var(--marker-red);color:#fff;border-radius:4px;padding:1px 9px;font:800 1.1rem/1.4 var(--font-d)}

/* ---------- blocks ---------- */
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.block.flush{padding:0;overflow:hidden}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.block-head > :first-child{min-width:0}
.block-head > :last-child{flex:none}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.section{display:flex;flex-direction:column;gap:10px}
.warnline{display:flex;gap:10px;align-items:flex-start;color:var(--need);font-weight:600;font-size:.92rem}
.warnline svg{flex:none;margin-top:2px}

/* next steps */
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.steps li:first-child .step{border-top:0}
.step .st{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;flex:none;font-weight:800;font-size:.9rem;margin-top:1px}
.st.todo{background:var(--need-soft);color:var(--need)}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.ready{background:var(--ready-soft);color:var(--ready)}
.st.wait{background:transparent;color:var(--skip);border:2px dashed var(--line-2)}
.st.help{background:var(--lend-soft);color:var(--lend)}
.step .t{flex:1;min-width:0}
.step .t b{display:block;font-weight:700}
.step .t span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.9rem}
.step .chev{color:var(--faint);font-size:1.3rem;align-self:center}
.welcome{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.welcome ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.welcome .muted{color:var(--on-brand-muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r-s);border:1px solid transparent;font-weight:700;font-size:1rem;background:var(--accent);color:var(--on-accent);text-decoration:none;white-space:nowrap}
.btn:active{background:var(--accent-press)}
.btn.sec{background:var(--surface);border-color:var(--line-2);color:var(--text)}
.btn.sec:active{background:var(--surface-2)}
.btn.ink{background:var(--text);color:var(--surface)}
.btn.ink:active{opacity:.85}
.btn.ghost{background:transparent;color:var(--text);border-color:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.ghost:active{background:var(--surface-2)}
.btn.danger{background:transparent;border-color:var(--need);color:var(--need)}
.btn.danger:active{background:var(--need-soft)}
.btn.sm{min-height:42px;padding:0 14px;font-size:.92rem}
.btn.block-w{width:100%}
.btn:disabled,.btn[aria-busy="true"]{opacity:1;background:var(--line);color:var(--muted);border-color:transparent;cursor:not-allowed}
.btn.armed{background:var(--need-strong);color:#fff;border-color:var(--need-strong)}
@media (hover:hover){.btn:not(:disabled):hover{filter:brightness(.94)}.it-main:hover,.person:hover,.step:hover,.check-row:hover{background:var(--surface-2)}}
.pair-btns{display:flex;gap:10px;flex-wrap:wrap}
.pair-btns > .btn{flex:1 1 140px}

/* segmented */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:3px;gap:3px}
.seg button{flex:1 1 0;min-width:0;min-height:44px;border:0;background:none;border-radius:7px;font-weight:700;color:var(--muted);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-selected="true"]{background:var(--seg-on);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line-2)}
.seg.tight button{font-size:.84rem;padding:0 4px}
.seg .n{display:inline-block;margin-left:5px;background:var(--accent);color:#fff;border-radius:999px;font-size:.72rem;padding:0 6px;line-height:18px}
.sticky-seg{position:sticky;top:calc(var(--topbar-h) + env(safe-area-inset-top,0px));z-index:30;padding:6px 0;margin:-6px 0;background:var(--bg)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.84rem;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.need{background:var(--need-soft);color:var(--need);border-color:transparent}
.chip.lend{background:var(--lend-soft);color:var(--lend);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.ready{background:var(--ready-soft);color:var(--ready);border-color:transparent}
.chip.skip{background:var(--skip-soft);color:var(--skip);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ghostchip{background:transparent;border-style:dashed;color:var(--faint)}
button.chip{cursor:pointer;min-height:36px;padding:0 14px}
button.chip[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
a.chip,button.chip.link{text-decoration:none;cursor:pointer}
.chip.link{min-height:auto;padding:3px 10px}

/* progress */
.prog{display:flex;flex-direction:column;gap:10px}
.prog .big{font:800 2.6rem/1 var(--font-d)}
.prog .big small{font:600 1rem var(--font-b);color:var(--muted);margin-left:6px}
.prog .big.alarm{color:var(--need)}
.bar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .35s ease}
.bar.full i{background:var(--ready)}
.bar.thin{height:6px;border:0;background:var(--line)}
.done-badge{display:inline-flex;align-items:center;gap:8px;background:var(--ready);color:#fff;font-weight:700;border-radius:999px;padding:6px 14px;align-self:flex-start}
@media (prefers-color-scheme:dark){.done-badge{color:#0C0C0D}}

/* checklist rows */
.group-title{display:flex;align-items:baseline;gap:10px;margin:8px 2px 0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.it{display:flex;align-items:flex-start;border-top:1px solid var(--line);transition:opacity .4s}
.it:first-child{border-top:0}
.it.leaving{opacity:.35}
.it-main{flex:1;min-width:0;display:flex;align-items:flex-start;gap:14px;padding:14px 6px 14px 14px;background:none;border:0;text-align:left;min-height:56px}
.it-main:active{background:var(--surface-2)}
.it-main:focus-visible,.it-more:focus-visible,.person:focus-visible,.step:focus-visible,.check-row:focus-visible{outline-offset:-3px}
.box{width:26px;height:26px;border-radius:6px;border:2px solid var(--ctrl);flex:none;display:grid;place-items:center;margin-top:-1px;color:var(--surface);transition:background .15s,border-color .15s,transform .15s}
.box svg{width:16px;height:16px;opacity:0}
.it.on .box{background:var(--ok);border-color:var(--ok)}
.it.on .box svg{opacity:1}
.it.lendrow.on .box{background:var(--lend);border-color:var(--lend);color:#fff}
.it.pop .box{transform:scale(1.15)}
.it.skip .box{background:var(--skip-soft);border-color:var(--line-2);border-style:dashed}
.it-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.it-name{font-weight:600;line-height:1.35}
.it.on .it-name,.it.skip .it-name{color:var(--muted)}
.it.skip .it-name{text-decoration:line-through}
.it-more{width:52px;height:56px;flex:none;background:none;border:0;color:var(--muted);font-size:1.25rem;letter-spacing:1px}
.it-more:active{background:var(--surface-2)}
.it-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px 54px;margin-top:-6px}
.empty{padding:22px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:1.05rem;margin-bottom:4px}
.note-inline{color:var(--muted);font-size:.88rem;font-style:italic}

/* people */
.person{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit;text-decoration:none}
.list .person:first-child{border-top:0}
.person:active{background:var(--surface-2)}
.person .t{flex:1;min-width:0}
.person .t b{display:block;font-weight:700}
.person .t span{color:var(--muted);font-size:.86rem}
.person .r{width:92px;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:.82rem;color:var(--muted);font-weight:600}
.person .r .bar{width:100%}
.person .chev{color:var(--faint);font-size:1.3rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px}
.tile b{font:800 1.8rem/1 var(--font-d)}
.tile span{font-size:.8rem;color:var(--muted);font-weight:600}
.tile[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.tile.alarm b{color:var(--need)}

/* needs */
.need-card{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.list .need-card:first-child{border-top:0}
.pair{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;font-size:.92rem}
.pair .k{color:var(--muted);padding-top:3px}

/* cars */
.car{display:flex;flex-direction:column;gap:12px}
.car-route{color:var(--muted);font-size:.92rem}
.seats{display:flex;flex-wrap:wrap;gap:8px}
.seat{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.88rem;font-weight:600;color:var(--text)}
button.seat{cursor:pointer}
.seat .av{width:26px;height:26px;font-size:.7rem;box-shadow:0 0 0 1.5px var(--line-2)}
.seat.free{border-style:dashed;border-color:var(--line-2);color:var(--faint);background:transparent;padding-left:12px}
.seat.me{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seat .role{color:var(--muted);font-weight:500}
.mycar{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
@media (prefers-color-scheme:dark){.mycar{border-color:var(--line-2)}}
.mycar .muted,.mycar .car-route{color:var(--on-brand-muted)}
.mycar .car-route b{color:#fff}
.mycar .seat{background:var(--brand-2);border-color:#3F3F46;color:#fff}
.mycar .seat .role{color:var(--on-brand-muted)}
.mycar .seat.free{background:transparent;color:var(--on-brand-muted);border-color:#555}
.mycar .btn.sec{background:transparent;color:var(--on-brand);border-color:#666}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--surface);font-size:1.4rem;font-weight:700}
.stepper output{min-width:48px;text-align:center;font:800 1.8rem/1 var(--font-d)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-weight:600;font-size:.92rem}
.field small{color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:48px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--surface);padding:10px 14px;font-size:1rem}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--text);box-shadow:0 0 0 3px color-mix(in srgb,var(--text) 15%,transparent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.pw{position:relative}
.pw .input{padding-right:90px}
.pw button{position:absolute;right:5px;top:5px;bottom:5px;border:0;background:var(--surface-2);border-radius:5px;padding:0 12px;font-weight:600;font-size:.85rem;color:var(--muted);min-width:72px}
.linkbox{font-size:.9rem;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r-s);padding:10px 12px;word-break:break-all;user-select:all}
.check-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;min-height:60px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.check-row:first-child{border-top:0}
.check-row .lbl b{display:block}
.check-row .lbl span{color:var(--muted);font-size:.86rem}
.toggle{width:52px;height:32px;border-radius:999px;background:var(--ctrl);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
[aria-checked="true"] > .toggle{background:var(--ok)}
[aria-checked="true"] > .toggle::after{transform:translateX(20px);background:var(--surface)}
[aria-checked="true"] > .toggle.red{background:var(--need)}
[aria-checked="true"] > .toggle.blue{background:var(--lend)}
@media (prefers-color-scheme:dark){[aria-checked="true"] > .toggle.red::after,[aria-checked="true"] > .toggle.blue::after{background:#0C0C0D}}
.teamchips{display:flex;gap:6px;flex-wrap:wrap}
.teamchips button{min-width:44px;min-height:40px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--surface);font-weight:700;padding:0 10px}
.teamchips button[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);border:0;animation:fade .18s ease}
.sheet{position:relative;width:100%;max-width:560px;max-height:88dvh;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:var(--shadow-sheet);
  padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:999px;background:var(--line-2);margin:0 auto 12px}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sheet-head .h2{flex:1}
.x{width:44px;height:44px;border-radius:999px;border:0;background:var(--surface-2);font-size:1.2rem;color:var(--muted);flex:none}
@media (min-width:960px){.sheet-wrap{align-items:center}.sheet{border-radius:16px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
body.sheet-open .toasts{bottom:calc(16px + env(safe-area-inset-bottom,0px));top:auto}
@media (min-width:960px){.toasts{bottom:28px;left:calc(50% + 124px)}}
.toast{pointer-events:none;background:var(--text);color:var(--surface);padding:11px 18px;border-radius:999px;font-weight:600;font-size:.94rem;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s ease;text-align:center}
.toast.err{background:var(--need-strong);color:#fff}

/* auth */
.auth{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.auth .hero{min-height:150px}
.auth .hero h1{font-size:clamp(2rem,9vw,2.8rem)}
.thumb{width:100%;max-width:340px;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r-s);border:1px solid var(--line)}
.kv{display:flex;flex-direction:column;gap:6px}
.kv > span:first-child{color:var(--muted);font-size:.85rem;font-weight:600}
.divider{height:1px;background:var(--line);margin:4px 0}
.summary{white-space:pre-wrap;font:500 .86rem/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:12px;max-height:280px;overflow:auto}

/* ---- Au de dat (others' extras) ---- */
.give-card{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.list > .give-card:first-child{border-top:0}
.give-card.wanted{box-shadow:inset 4px 0 0 var(--need)}
.give-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.give-head b{font-size:16px;line-height:1.3}
.givers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.givers li{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.givers .chip{display:inline-flex;align-items:center;gap:8px;padding-left:4px}
.givers .chip .av{width:26px;height:26px;font-size:11px}
.give-note{font-size:14px;color:var(--muted);font-style:italic}
.give-act{display:flex;align-items:center;justify-content:space-between;gap:10px}
.give-act .btn{flex:none}
.give-head .chip{flex:none;white-space:nowrap}

</style>

<body class="noapp">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== XCC — Supabase backend ===== */
const SUPABASE_URL = "https://fmdkcbvkohbgxrceegja.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtZGtjYnZrb2hiZ3hyY2VlZ2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NTA4NjUsImV4cCI6MjEwNjUyNjg2NX0.Stx7byO_C52xGXl4bKkoHrofXroZfd6_UeqlV9mTHU8";
const sb = window.XCC_MOCK || supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const S = {
  loaded: false, loadFailed: false, uid: null, email: "", me: null, meMissing: 0,
  profiles: [], items: [], teams: [], cars: [], cfg: {},
  page: "home", gearTab: "mine", onlyMissing: false, groupTab: "people", groupTeam: "all", q: "",
  adminTab: "requests", adminFilter: "all", listQ: "",
  authMode: new URLSearchParams(location.search).has("nou") ? "signup" : "login", checkEmail: "",
  recovering: false, sheet: null, leaving: {},
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SITE = location.origin + location.pathname;
const INVITE = SITE + "?nou";
const PAGES = ["home", "gear", "transport", "group", "admin"];
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

/* ---------- domain helpers ---------- */
const isOpt = it => /op[tț]ional/i.test(it.cat || "");
const isTeam = it => /^echip/i.test(it.cat || "") || /\/\s*echip/i.test(it.name || "");
const groupOf = it => isOpt(it) ? "Opțional" : (it.cat || "Altele").replace(/\s*obligatoriu\s*/i, "").trim() || "Altele";
const itemById = id => S.items.find(i => i.id === id);
const reqItems = () => S.items.filter(i => !isOpt(i) && !isTeam(i));
const optItems = () => S.items.filter(i => isOpt(i) && !isTeam(i));
const teamItems = () => S.items.filter(isTeam);
const teamReq = () => teamItems().filter(i => !isOpt(i));
const people = () => S.profiles.filter(p => p.status === "approved");
const pending = () => S.profiles.filter(p => p.status === "pending");
const isAdmin = () => S.me?.role === "admin" && S.me?.status === "approved";
const approved = () => S.me?.status === "approved";
const byId = id => S.profiles.find(p => p.id === id);
/* item state: {ok, need, lend, skip, note}; older rows used a single `flag` field */
function st(p, id){
  const s = p?.items?.[id] || {};
  return { ok: !!s.ok, need: s.need ?? s.flag === "need", lend: s.lend ?? s.flag === "lend", skip: s.skip ?? s.flag === "skip", note: s.note || "" };
}
const has = (p, id) => st(p, id).ok;
const carOf = id => { const r = byId(id)?.ride; return S.cars.find(c => c.id === r) || null; };
const teamOf = id => { const t = byId(id)?.team; return S.teams.find(x => x.id === t) || null; };
const membersOf = tid => people().filter(p => p.team === tid);
const mates = () => { const t = teamOf(S.uid); return t ? membersOf(t.id) : []; };
const ridersOf = car => people().filter(p => p.ride === car.id && p.id !== car.owner);
const freeOf = car => Math.max(0, (car.seats || 0) - ridersOf(car).length);
const isDriver = id => S.cars.some(c => c.owner === id);
const ownWay = p => !!p?.own_transport;
const noRide = () => people().filter(p => !carOf(p.id) && !ownWay(p));
const missingOf = p => reqItems().filter(i => !has(p, i.id));
const othersExtra = () => S.items.filter(i => !isTeam(i) && lendersOf(i.id, S.uid).length);
const lendersOf = (id, except) => people().filter(x => x.id !== except && st(x, id).lend);
const seekersOf = (id, except) => people().filter(x => x.id !== except && st(x, id).need);
const firstName = n => String(n || "").trim().split(/\s+/)[0] || "";
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
/* first name, plus surname initial when two people share a first name */
function shortName(p){
  if (!p) return "Cineva";
  const f = firstName(p.name), parts = String(p.name || "").trim().split(/\s+/);
  const dup = people().filter(x => firstName(x.name).toLowerCase() === f.toLowerCase()).length > 1;
  return dup && parts.length > 1 ? `${f} ${parts[parts.length - 1][0]}.` : f;
}
const nameOf = id => shortName(byId(id));
function teamGaps(tid){ const m = membersOf(tid); return teamReq().filter(i => !m.some(p => has(p, i.id))); }

function avatar(p, cls = ""){
  const name = p?.name || "?";
  const ini = name.trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase() || "?";
  const hues = ["#1F1F1F", "#3A3A3A", "#4A4F57", "#5B544C", "#2F3B45", "#45403A"];
  let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `<span class="av ${cls}" style="background:${hues[h % hues.length]}" aria-hidden="true">${esc(ini)}</span>`;
}
/* Romanian trail markings: white square with a red band / dot / cross / triangle */
function marker(type){
  const shapes = {
    band: '<rect class="red" x="2" y="8.5" width="20" height="7"/>',
    dot: '<circle class="red" cx="12" cy="12" r="5.2"/>',
    cross: '<path class="red" d="M9.4 4.5h5.2v4.9h4.9v5.2h-4.9v4.9H9.4v-4.9H4.5V9.4h4.9z"/>',
    tri: '<path class="red" d="M12 5.2l6.6 12.6H5.4z"/>',
    key: '<path class="ink" d="M9.5 6.5a3.6 3.6 0 0 1 3.4 4.8l5.6 5.6v2.4h-2.4v-1.6h-1.6v-1.6h-1.6l-1.5-1.5a3.6 3.6 0 1 1-1.9-8.1zm-.9 2.2a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/>',
  };
  return `<svg class="mk" viewBox="0 0 24 24" aria-hidden="true"><rect class="bg" x="1" y="1" width="22" height="22" rx="3"/>${shapes[type] || shapes.band}</svg>`;
}
const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const WARN = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2z" fill="currentColor"/><path d="M12 10v5M12 17.5v.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';

/* ---------- feedback ---------- */
function toast(msg, err){
  const box = $("toasts"); box.innerHTML = "";
  const el = document.createElement("div");
  el.className = "toast" + (err ? " err" : ""); el.textContent = msg; el.setAttribute("role", err ? "alert" : "status");
  box.appendChild(el);
  setTimeout(() => el.remove(), err ? 4500 : 2800);
}
function authErr(m = ""){
  if (/rate limit|too many|seconds/i.test(m)) return "Prea multe încercări. Mai încearcă peste câteva minute.";
  if (/fetch|network|Failed/i.test(m)) return "Nu ai internet. Verifică semnalul și încearcă din nou.";
  if (/same|different/i.test(m)) return "Alege altă parolă decât cea veche.";
  if (/at least|weak|short/i.test(m)) return "Parola trebuie să aibă minim 8 caractere.";
  if (/invalid.*email|email.*invalid/i.test(m)) return "Emailul nu pare corect.";
  if (/expired|invalid.*token|otp/i.test(m)) return "Linkul a expirat. Cere unul nou cu „Am uitat parola”.";
  return "Ceva n-a mers. Încearcă din nou.";
}
async function write(fn, okMsg){
  try {
    const r = await fn();
    if (r?.error) throw r.error;
    if (okMsg) toast(okMsg);
    scheduleReload(250);
    return r ?? true;
  } catch(e){
    console.error(e);
    const m = e?.message || "";
    toast(/plin/i.test(m) ? "Mașina s-a umplut între timp. Alege alta." : /organizator/i.test(m) ? m
      : /fetch|network|Failed/i.test(m) ? "Nu s-a salvat: nu ai internet." : "Nu s-a salvat. Încearcă din nou.", true);
    scheduleReload(400);
    return false;
  }
}
/* two-tap confirm; a second tap within 500 ms (double-tap) doesn't count */
function arm(b, label){
  const now = Date.now();
  if (b.dataset.armed && now - Number(b.dataset.armedAt) > 500) return true;
  if (b.dataset.armed) return false;
  b.dataset.armed = "1"; b.dataset.armedAt = now;
  const old = b.innerHTML; b.textContent = label || "Apasă încă o dată ca să confirmi"; b.classList.add("armed");
  setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.innerHTML = old; b.classList.remove("armed"); } }, 4000);
  return false;
}
async function busy(btn, fn){
  if (!btn) return fn();
  if (btn.getAttribute("aria-busy") === "true") return;
  btn.setAttribute("aria-busy", "true"); btn.disabled = true;
  try { return await fn(); } finally { if (btn.isConnected){ btn.removeAttribute("aria-busy"); btn.disabled = false; } }
}

/* ---------- data ---------- */
async function loadAll(){
  try {
    const cfg = await sb.from("config").select("*").eq("id", 1).maybeSingle();
    if (!cfg.error) S.cfg = cfg.data || {};
    if (S.uid){
      const [pr, it, tm, cr] = await Promise.all([
        sb.from("profiles").select("*").order("created_at"),
        sb.from("items").select("*").order("ord"),
        sb.from("teams").select("*").order("created_at"),
        sb.from("cars").select("*").order("created_at"),
      ]);
      const err = pr.error || it.error || tm.error || cr.error;
      if (err) throw err;
      S.profiles = pr.data || []; S.items = it.data || []; S.teams = tm.data || []; S.cars = cr.data || [];
      S.me = S.profiles.find(p => p.id === S.uid) || null;
      S.meMissing = S.me ? 0 : S.meMissing + 1;
      if (!S.me && S.meMissing < 3) scheduleReload(1500);
    }
    S.loadFailed = false;
  } catch(e){
    console.error(e);
    if (S.loaded && !S.loadFailed) toast("Fără conexiune. Vezi ultimele date salvate.", true);
    else S.loadFailed = true;
  }
  S.loaded = true;
  render();
}
let reloadT;
function scheduleReload(ms = 400){ clearTimeout(reloadT); reloadT = setTimeout(loadAll, ms); }
let channel;
function subscribe(){
  if (!sb.channel) return;
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("xcc-live").on("postgres_changes", { event: "*", schema: "public" }, () => scheduleReload()).subscribe();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.uid) scheduleReload(100); });

/* ---------- navigation (real history, so the phone's Back button works) ---------- */
function routeHash(page, tab){ return page === "home" ? location.pathname + location.search : `#${page}${tab ? "/" + tab : ""}`; }
function go(page, opts = {}, push = true){
  if (!PAGES.includes(page) || (page === "admin" && !isAdmin())) page = "home";
  const changed = page !== S.page || opts.gearTab || opts.adminTab || opts.groupTab;
  Object.assign(S, opts);
  if (S.sheet) closeSheet(true);
  S.page = page;
  const tab = page === "gear" ? S.gearTab : page === "admin" ? S.adminTab : page === "group" ? S.groupTab : "";
  try { if (push && changed) history.pushState({ page }, "", routeHash(page, ["mine", "requests", "people"].includes(tab) ? "" : tab)); } catch {}
  render(); window.scrollTo({ top: 0 });
}
function readHash(){
  const [p, t] = (location.hash || "").slice(1).split("/");
  S.page = PAGES.includes(p) ? p : "home";
  if (p === "gear") S.gearTab = ["mine", "team", "extra"].includes(t) ? t : "mine";
  if (p === "admin") S.adminTab = ["requests", "people", "teams", "list", "settings"].includes(t) ? t : "requests";
  if (p === "group") S.groupTab = ["people", "give", "needs", "items"].includes(t) ? t : "people";
}
window.addEventListener("popstate", () => {
  if (S.sheet){ closeSheet(true); return; }
  readHash(); render();
});

/* ---------- shared bits ---------- */
function heroArt(){
  if (S.cfg.hero_url) return `<img src="${esc(S.cfg.hero_url)}" alt="">`;
  return `<svg viewBox="0 0 800 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9B9B9"/><stop offset=".6" stop-color="#7A7A7A"/><stop offset="1" stop-color="#3A3A3A"/></linearGradient></defs>
    <rect width="800" height="420" fill="url(#sk)"/>
    <path d="M0 210 L110 150 L180 185 L290 110 L380 170 L470 125 L560 190 L650 140 L740 175 L800 150 V420 H0Z" fill="#5A5A5A" opacity=".8"/>
    <path d="M0 265 L130 205 L220 245 L330 190 L420 240 L520 200 L610 255 L700 215 L800 245 V420 H0Z" fill="#3A3A3A"/>
    <g fill="#1E1E1E">${Array.from({length: 26}, (_, i) => { const x = i * 32 - 6, h = 46 + (i * 37 % 34), y = 330 - (i * 23 % 26); return `<path d="M${x} ${y} l14 -${h} l14 ${h}z"/>`; }).join("")}</g>
    <path d="M0 340 H800 V420 H0Z" fill="#111"/>
    <rect x="652" y="250" width="22" height="120" fill="#2A2A2A"/>
    <g transform="translate(663 292)"><rect x="-11" y="-11" width="22" height="22" rx="2" fill="#F4F4F4"/><rect x="-11" y="-4" width="22" height="8" fill="#CF171F"/></g>
  </svg>`;
}
function daysLeft(){
  if (!S.cfg.start_date) return null;
  const d = new Date(S.cfg.start_date + "T00:00:00"), n = new Date();
  return Math.ceil((d - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5);
}
/* "5–8 noiembrie 2026" (or "30 octombrie – 2 noiembrie 2026" across months) */
function dateRange(iso, days){
  try {
    const s = new Date(iso + "T00:00:00"), e = new Date(s); e.setDate(s.getDate() + days);
    const m = d => d.toLocaleDateString("ro-RO", { month: "long" });
    return s.getMonth() === e.getMonth() ? `${s.getDate()}–${e.getDate()} ${m(e)} ${e.getFullYear()}` : `${s.getDate()} ${m(s)} – ${e.getDate()} ${m(e)} ${e.getFullYear()}`;
  } catch { return iso; }
}
function hero(compact){
  const dl = daysLeft();
  const when = S.cfg.start_date ? dateRange(S.cfg.start_date, 3) : "Noiembrie 2026";
  return `<section class="hero">${heroArt()}<div class="txt">
    ${dl !== null && dl > 0 ? `<span class="count-pill"><b>${dl}</b>${dl === 1 ? "zi până la start" : "zile până la start"}</span>` : dl === 0 ? `<span class="count-pill"><b>Azi</b>plecăm</span>` : ""}
    <h1>Xtreme Character Challenge</h1>
    ${compact ? "" : `<p>${esc(when)}</p>`}</div></section>`;
}
const personBtn = (p, cls = "") => p ? `<button class="chip link ${cls}" data-person="${esc(p.id)}">${esc(shortName(p))}</button>` : "";
function itemRow(it, kind){
  const s = st(S.me, it.id), on = s.ok, leaving = S.leaving[it.id];
  const chips = [];
  if (kind === "team"){
    const others = (teamOf(S.uid) ? mates() : []).filter(p => p.id !== S.uid && has(p, it.id));
    if (others.length) chips.push(`<span class="chip ok">Aduce ${esc(others.map(shortName).join(", "))}</span>`);
  }
  if (s.need){
    chips.push('<span class="chip need">Am nevoie</span>');
    const l = lendersOf(it.id, S.uid);
    if (l.length) chips.push(`<span class="chip lend">Are în plus:</span>${l.map(p => personBtn(p, "lend")).join("")}`);
  }
  if (s.lend && kind !== "team") chips.push('<span class="chip lend">Am de dat</span>');
  if (s.skip) chips.push('<span class="chip skip">Nu iau</span>');
  return `<div class="it ${on ? "on" : ""} ${s.skip ? "skip" : ""} ${leaving ? "leaving" : ""}" data-row="${esc(it.id)}">
    <button class="it-main" data-toggle="${esc(it.id)}" aria-pressed="${on}">
      <span class="box">${CHECK}</span>
      <span class="it-body"><span class="it-name">${esc(it.name)}</span>

}

/* ---------- pages ---------- */
function pageHome(){
  const p = S.me, miss = missingOf(p), car = carOf(S.uid), team = teamOf(S.uid);
  const steps = [];
  if (isAdmin() && pending().length) steps.push({ go: "admin", tab: "requests", cls: "todo", ic: pending().length, t: `${plural(pending().length, "cerere nouă", "cereri noi")} de aprobat`, s: pending().map(x => x.name).join(", ") });
  steps.push(miss.length
    ? { go: "gear", cls: "todo", ic: miss.length, t: miss.length === reqItems().length ? "Începe cu lista de echipament" : `Îți ${miss.length === 1 ? "lipsește un lucru obligatoriu" : `lipsesc ${miss.length} lucruri obligatorii`}`, s: miss.slice(0, 3).map(i => i.name).join(", ") + (miss.length > 3 ? "…" : "") }
    : { go: "gear", cls: "ready", ic: "✓", t: "Ai tot echipamentul obligatoriu", s: optItems().some(i => !has(p, i.id) && !st(p, i.id).skip) ? "Mai ai de hotărât câteva opționale." : "Ești gata de drum." });
  const found = S.items.filter(i => st(p, i.id).need && lendersOf(i.id, S.uid).length);
  if (found.length) steps.push({ go: "gear", cls: "help", ic: found.length, t: found.length === 1 ? `Cineva are în plus: ${found[0].name}` : `Cineva are în plus ${found.length} lucruri pe care le cauți`, s: found.map(i => `${i.name}: ${lendersOf(i.id, S.uid).map(shortName).join(", ")}`).join(" · ") });
  steps.push(car
    ? { go: "transport", cls: "done", ic: "✓", t: car.owner === S.uid ? "Conduci" : `Mergi cu ${nameOf(car.owner)}`, s: [car.from_city && `din ${car.from_city}`, car.when_text].filter(Boolean).join(", ") || "Detalii la Transport" }
    : ownWay(p) ? { go: "transport", cls: "done", ic: "✓", t: "Vii pe cont propriu", s: "Dacă se schimbă ceva, alege un loc la Transport." }
    : { go: "transport", cls: "todo", ic: "!", t: "Încă n-ai loc într-o mașină", s: S.cars.length ? `${plural(S.cars.reduce((n, c) => n + freeOf(c), 0), "loc liber", "locuri libere")} acum` : "Ai mașină? Adaug-o." });
  if (!team) steps.push({ go: "gear", tab: "team", cls: "wait", ic: "", t: "Aștepți repartizarea pe echipe", s: "Le facem după ce primim listele de la 4M." });
  else { const gaps = teamGaps(team.id);
    steps.push(gaps.length ? { go: "gear", tab: "team", cls: "todo", ic: gaps.length, t: `${team.name}: ${gaps.length === 1 ? "lipsește un lucru" : `lipsesc ${gaps.length} lucruri`} de echipă`, s: gaps.map(i => i.name).join(", ") }
      : { go: "gear", tab: "team", cls: "done", ic: "✓", t: `Ești în ${team.name}`, s: "Echipa are tot echipamentul comun." }); }
  const othersOffer = othersExtra().filter(i => !isOpt(i) && !has(p, i.id) && !st(p, i.id).need);
  if (othersOffer.length) steps.splice(1, 0, { go: "group", tab: "give", cls: "help", ic: othersOffer.length, t: othersOffer.length === 1 ? `Cineva are în plus: ${othersOffer[0].name}` : `${othersOffer.length} lucruri care îți lipsesc le are cineva în plus`, s: othersOffer.slice(0, 3).map(i => i.name).join(", ") + (othersOffer.length > 3 ? "…" : "") });
  const nOffer = othersExtra().length;
  const canHelp = S.items.filter(i => st(p, i.id).lend && seekersOf(i.id, S.uid).length);
  const myExtra = S.items.filter(i => st(p, i.id).lend);
  const welcome = !lsGet("xcc-welcome") ? `<div class="block welcome stack"><h2 class="h2">Bine ai venit în grup</h2>
      <ol><li>Bifează ce ai din lista obligatorie.</li><li>Ia-ți loc într-o mașină sau adaugă-ți mașina.</li><li>Ce ai în plus trece la „De dat”.</li></ol>
      <p class="muted small">Ce bifezi vede tot grupul, ca să ne ajutăm între noi.</p>
      <button class="btn sec sm" data-welcome style="align-self:flex-start">Am înțeles</button></div>` : "";
  return `${hero()}${welcome}
    <div class="section"><h2 class="h2">Salut, ${esc(firstName(p.name))}</h2>
      <ul class="steps block flush">${steps.map(x => `<li><button class="step" data-go="${x.go}" ${x.tab ? `data-tab="${x.tab}"` : ""}>
        <span class="st ${x.cls}">${x.ic}</span><span class="t"><b>${esc(x.t)}</b><span>${esc(x.s)}</span></span><span class="chev" aria-hidden="true">›</span></button></li>`).join("")}</ul></div>
    ${nOffer ? `<button class="block step" data-go="group" data-tab="give"><span class="st help">${nOffer}</span><span class="t"><b>Vezi ce au alții de dat</b><span>${plural(nOffer, "lucru pus", "lucruri puse")} la dispoziție de grup</span></span><span class="chev" aria-hidden="true">›</span></button>` : ""}
    <div class="warnline">${WARN}<span>Fără echipamentul obligatoriu nu poți participa. Organizatorul nu asigură nimic din listă.</span></div>
    ${canHelp.length ? `<div class="section"><h2 class="h2">Poți ajuta</h2><div class="list">${canHelp.slice(0, 5).map(i => {
      const who = seekersOf(i.id, S.uid);
      return `<div class="need-card"><b>${esc(i.name)}</b><span class="chips"><span class="chip need">Caută:</span>${who.map(x => personBtn(x, "need")).join("")}</span></div>`; }).join("")}</div></div>`
      : `<button class="block step" data-go="gear" data-tab="extra"><span class="st help">+</span><span class="t"><b>${myExtra.length ? `Ai ${plural(myExtra.length, "lucru", "lucruri")} de dat` : "Ai echipament în plus?"}</b><span>${myExtra.length ? "Nimeni nu le caută acum. Apar aici când cineva le cere." : "Trece-l la „De dat”, ca să-l găsească cine are nevoie."}</span></span><span class="chev" aria-hidden="true">›</span></button>`}
    <p class="small muted"><a href="https://www.4mro.ro/regulament-xcc" target="_blank" rel="noopener">Regulamentul XCC pe 4mro.ro</a></p>`;
}

function pageGear(){
  const tab = S.gearTab, p = S.me;
  const nExtra = S.items.filter(i => st(p, i.id).lend).length;
  const seg = `<div class="sticky-seg"><div class="seg" role="tablist"><button role="tab" data-gtab="mine" aria-selected="${tab === "mine"}">Al meu</button><button role="tab" data-gtab="team" aria-selected="${tab === "team"}">De echipă</button><button role="tab" data-gtab="extra" aria-selected="${tab === "extra"}">De dat${nExtra ? ` (${nExtra})` : ""}</button></div></div>`;
  if (tab === "extra"){
    const list = S.items.filter(i => !isTeam(i) && !st(p, i.id).need);
    const row = it => {
      const s = st(p, it.id), seekers = seekersOf(it.id, S.uid);
      return `<div class="it lendrow ${s.lend ? "on" : ""}">
        <button class="it-main" data-extra="${esc(it.id)}" aria-pressed="${s.lend}"><span class="box">${CHECK}</span>
          <span class="it-body"><span class="it-name">${esc(it.name)}</span>
          ${s.lend && s.note ? `<span class="note-inline">${esc(s.note)}</span>` : ""}</span></button>
        <button class="it-more" data-more="${esc(it.id)}" aria-label="Opțiuni pentru ${esc(it.name)}">•••</button></div>
        ${seekers.length ? `<div class="it-chips"><span class="chip need">Caută:</span>${seekers.map(x => personBtn(x, "need")).join("")}</div>` : ""}`;
    };
    const sought = list.filter(i => seekersOf(i.id, S.uid).length);
    const groups = {};
    for (const it of list.filter(i => !sought.includes(i))) (groups[groupOf(it)] ??= []).push(it);
    return `<h1 class="h1">Echipament</h1>${seg}
      <div class="block stack"><p><b>Ce ai în plus și poți da altcuiva.</b></p>
        <p class="muted small">Bifează aici doar lucrurile pe care le ai în plus, nu pe cele pe care le iei tu. Din ••• adaugi o notă, de exemplu mărimea.</p>
        ${nExtra ? `<span class="chip lend" style="align-self:flex-start">Ai ${plural(nExtra, "lucru", "lucruri")} de dat</span>` : ""}</div>
      ${sought.length ? `<section class="section"><div class="group-title"><h2 class="h2">Le caută cineva</h2></div><div class="list">${sought.map(row).join("")}</div></section>` : ""}
      ${Object.entries(groups).map(([g, l]) => `<section class="section"><div class="group-title"><h2 class="h2">${esc(g)}</h2></div><div class="list">${l.map(row).join("")}</div></section>`).join("")}`;
  }
  if (tab === "team"){
    const team = teamOf(S.uid), list = teamItems(), who = team ? mates() : [p];
    const sorted = [...list].sort((a, b) => (who.some(x => has(x, a.id)) ? 1 : 0) - (who.some(x => has(x, b.id)) ? 1 : 0));
    const covered = teamReq().filter(i => who.some(x => has(x, i.id))).length, needed = teamReq().length;
    return `<h1 class="h1">Echipament</h1>${seg}
      <div class="block stack">
        ${team ? `<div class="block-head"><h2 class="h3">${esc(team.name)}</h2><span class="muted small">${esc(mates().map(shortName).join(", "))}</span></div>
          <div class="prog">${covered === needed ? '<span class="done-badge">✓ Echipa are tot ce e comun</span>' : `<div class="big alarm">${needed - covered}<small>lipsesc din ${needed} obligatorii</small></div>`}<div class="bar ${covered === needed ? "full" : ""}"><i style="width:${needed ? covered / needed * 100 : 0}%"></i></div></div>`
        : `<p><b>Încă nu ești într-o echipă.</b></p><p class="muted">Echipele le facem după ce primim listele de la 4M. Până atunci, bifează ce ai putea aduce tu.</p>`}
        <p class="small muted">Se aduc pentru toată echipa. Bifează doar ce aduci tu, ca să nu vină toți cu același lucru. Uită-te la cantitate (ex. 2–3 butelii).</p>
      </div>
      <div class="list">${sorted.map(i => itemRow(i, "team")).join("") || '<div class="empty">Nimic pe listă.</div>'}</div>`;
  }
  const req = reqItems(), opt = optItems(), haveReq = req.filter(i => has(p, i.id)).length, missN = req.length - haveReq;
  const groups = {};
  for (const it of req) (groups[groupOf(it)] ??= []).push(it);
  const filt = l => S.onlyMissing ? l.filter(i => S.leaving[i.id] || (!has(p, i.id) && !st(p, i.id).skip)) : l;
  const sections = Object.entries(groups).map(([g, l]) => {
    const vis = filt(l); if (!vis.length) return "";
    const done = l.filter(i => has(p, i.id)).length;
    return `<section class="section"><div class="group-title"><h2 class="h2">${esc(g)}</h2>${done === l.length ? `<span class="chip ok">✓ ${done}/${l.length}</span>` : `<span class="count muted small">${done}/${l.length}</span>`}</div>
      <div class="list">${vis.map(i => itemRow(i, "mine")).join("")}</div></section>`;
  }).join("");
  const optVis = filt(opt);
  const optDone = opt.filter(i => has(p, i.id) || st(p, i.id).skip).length;
  return `<h1 class="h1">Echipament</h1>${seg}
    <div class="block prog">
      ${missN === 0 && req.length ? `<span class="done-badge">✓ Ai tot ce e obligatoriu</span>` : `<div class="big alarm">${missN}<small>${missN === 1 ? "lipsește" : "lipsesc"} · ${haveReq} din ${req.length} bifate</small></div>`}
      <div class="bar ${missN === 0 ? "full" : ""}"><i style="width:${req.length ? haveReq / req.length * 100 : 0}%"></i></div>
      <div class="row"><span class="small muted">Apasă pe un rând ca să-l bifezi. Din ••• ceri ce-ți lipsește.</span><span class="spacer"></span>
        <button class="chip" data-missing aria-pressed="${S.onlyMissing}">Doar ce-mi lipsește</button></div>
    </div>
    ${sections}
    ${S.onlyMissing && !sections ? `<div class="block empty"><b>Nu-ți lipsește nimic obligatoriu</b>${optVis.length ? `Mai ai ${plural(optVis.length, "opțional nehotărât", "opționale nehotărâte")} mai jos.` : "Ești pregătit de drum."}</div>` : ""}
    ${optVis.length ? `<section class="section"><div class="group-title"><h2 class="h2">Opțional</h2><span class="count muted small">${optDone}/${opt.length} decise</span></div>
      <div class="list">${optVis.map(i => itemRow(i, "mine")).join("")}</div></section>` : ""}`;
}

function pageTransport(){
  const p = S.me, mine = carOf(S.uid), owned = S.cars.find(c => c.owner === S.uid);
  const free = S.cars.reduce((n, c) => n + freeOf(c), 0), waiting = noRide(), own = people().filter(ownWay);
  const seat = (x, role = "") => `<button class="seat ${x.id === S.uid ? "me" : ""}" data-person="${esc(x.id)}">${avatar(x)}${esc(shortName(x))}${role ? ` <span class="role">${role}</span>` : ""}</button>`;
  const seats = c => {
    const out = [byId(c.owner) ? seat(byId(c.owner), "șofer") : ""];
    for (const r of ridersOf(c)) out.push(seat(r));
    for (let i = 0; i < freeOf(c); i++) out.push('<span class="seat free">loc liber</span>');
    return `<div class="seats">${out.join("")}</div>`;
  };
  const route = c => { const parts = [c.from_city && `Din <b>${esc(c.from_city)}</b>`, c.when_text && esc(c.when_text)].filter(Boolean); return parts.length ? `<p class="car-route">${parts.join(", ")}</p>` : ""; };
  let myBlock;
  if (mine) myBlock = `<div class="block mycar car">
      <div class="block-head"><h2 class="h2">${mine.owner === S.uid ? "Conduci" : `Mergi cu ${esc(nameOf(mine.owner))}`}</h2></div>
      ${route(mine)}${seats(mine)}${mine.note ? `<p class="muted small">${esc(mine.note)}</p>` : ""}
      <div class="row">${mine.owner === S.uid ? `<button class="btn sec sm" data-car-edit="${esc(mine.id)}">Editează mașina</button>` : `<button class="btn sec sm" data-leave>Renunț la loc</button>`}</div></div>`;
  else if (ownWay(p)) myBlock = `<div class="block stack"><h2 class="h2">Vii pe cont propriu</h2>
      <p class="muted">Nu apari la „Fără loc”. Dacă ai totuși nevoie de loc, schimbă mai jos.</p>
      <div class="row"><button class="btn sec sm" data-ownway="0">Am nevoie de loc</button></div></div>`;
  else myBlock = `<div class="block stack"><h2 class="h2">Încă n-ai loc</h2>
      <p class="muted">${free ? `Sunt ${plural(free, "loc liber", "locuri libere")}. Alege o mașină de mai jos.` : "Nu sunt locuri libere acum. Ești pe lista „Fără loc” și Clau te ajută să găsești unul."}</p>
      <div class="pair-btns"><button class="btn" data-car-new>Am mașină</button><button class="btn sec" data-ownway="1">Vin pe cont propriu</button></div></div>`;
  const others = S.cars.filter(c => c.id !== mine?.id);
  return `<h1 class="h1">Transport</h1>${myBlock}
    ${others.length ? `<section class="section"><div class="group-title"><h2 class="h2">${mine ? "Alte mașini" : "Mașini"}</h2><span class="count muted small">${plural(free, "loc liber", "locuri libere")}</span></div>
      ${others.map(c => { const f = freeOf(c), canJoin = !owned && f > 0, canEdit = isAdmin() && c.owner !== S.uid;
        return `<div class="block car">
        <div class="block-head"><h3 class="h3">Mașina lui ${esc(nameOf(c.owner))}</h3>${f ? `<span class="chip ok">${plural(f, "loc liber", "locuri libere")}</span>` : '<span class="chip ghostchip">Plină</span>'}</div>
        ${route(c)}${seats(c)}${c.note ? `<p class="muted small">${esc(c.note)}</p>` : ""}
        ${canJoin || canEdit ? `<div class="row">${canJoin ? `<button class="btn ${mine ? "sec" : ""} sm" data-join="${esc(c.id)}">${mine ? "Mută-mă aici" : "Iau un loc"}</button>` : ""}${canEdit ? `<button class="btn sec sm" data-car-edit="${esc(c.id)}">Editează</button>` : ""}</div>` : ""}
      </div>`; }).join("")}</section>` : (mine ? "" : '<div class="block empty"><b>Nicio mașină încă</b>Cine are mașină o adaugă cu „Am mașină”.</div>')}
    ${!owned && mine ? `<button class="btn sec" data-car-new style="align-self:flex-start">Am și eu mașină</button>` : ""}
    <section class="section"><div class="group-title"><h2 class="h2">Fără loc</h2><span class="count muted small">${waiting.length}</span></div>
      ${waiting.length ? `<div class="chips">${waiting.slice(0, 14).map(x => personBtn(x, x.id === S.uid ? "need" : "")).join("")}${waiting.length > 14 ? `<span class="chip">+${waiting.length - 14}</span>` : ""}</div>` : '<p class="muted">Toată lumea are loc.</p>'}
      ${own.length ? `<p class="small muted">Pe cont propriu: ${esc(own.map(shortName).join(", "))}</p>` : ""}
      ${isAdmin() && people().length && S.cars.length ? `<button class="btn sec sm" data-assign style="align-self:flex-start">Repartizează oamenii</button>` : ""}</section>`;
}

function groupList(){ return people().filter(p => S.groupTeam === "all" || (S.groupTeam === "none" ? !teamOf(p.id) : p.team === S.groupTeam)); }
function pageGroup(){
  const t = S.groupTab;
  const seg = `<div class="seg" role="tablist">
    <button role="tab" data-grtab="people" aria-selected="${t === "people"}">Oameni</button>
    <button role="tab" data-grtab="give" aria-selected="${t === "give"}">De dat</button>
    <button role="tab" data-grtab="needs" aria-selected="${t === "needs"}">Caută</button>
    <button role="tab" data-grtab="items" aria-selected="${t === "items"}">Obiecte</button></div>`;

    ${[["all", "Toți"], ...S.teams.map(x => [x.id, x.name]), ["none", "Fără echipă"]].map(([v, l]) => `<button class="chip" data-team-filter="${esc(v)}" aria-pressed="${S.groupTeam === v}">${esc(l)}</button>`).join("")}</div>` : "";
  const list = groupList();
  let body;
  if (t === "people"){
    body = `<input class="input" type="search" id="q" placeholder="Caută un nume" value="${esc(S.q)}" aria-label="Caută un nume" autocomplete="off" enterkeyhint="search">
      <div class="list" id="peopleList">${peopleRows(list, reqItems().length)}</div>`;
  } else if (t === "give"){
    const rows = othersExtra().map(i => ({ i, by: lendersOf(i.id, S.uid).filter(p => list.includes(p)) })).filter(r => r.by.length);
    const groups = {};
    for (const r of rows) (groups[groupOf(r.i)] ??= []).push(r);
    const card = ({ i, by }) => { const s = st(S.me, i.id);
      return `<div class="give-card ${s.need ? "wanted" : ""}">
        <div class="give-head"><b>${esc(i.name)}</b>${!isOpt(i) && !s.ok ? '<span class="chip need">Îți lipsește</span>' : ""}</div>
        <ul class="givers">${by.map(p => `<li><button class="chip link lend" data-person="${esc(p.id)}">${avatar(p)}${esc(shortName(p))}</button>${st(p, i.id).note ? `<span class="give-note">${esc(st(p, i.id).note)}</span>` : ""}</li>`).join("")}</ul>
        ${s.need ? '<div class="give-act"><span class="small">Ai cerut. Vorbiți pe grupul de WhatsApp.</span><button class="btn ghost sm" data-want="0" data-id="' + esc(i.id) + '">Anulează</button></div>'
          : s.ok ? '<div class="give-act"><span class="small muted">Îl ai deja.</span></div>'
          : `<div class="give-act"><button class="btn ink sm" data-want="1" data-id="${esc(i.id)}">Îl vreau</button></div>`}</div>`; };
    const mine = rows.filter(r => !isOpt(r.i) && !st(S.me, r.i.id).ok);
    body = rows.length ? `<p class="muted">Ce au alții în plus și pot da. Apasă „Îl vreau” ca să vadă că îl ceri, apoi vorbiți pe grupul de WhatsApp.</p>
      ${mine.length ? `<section class="section"><div class="group-title"><h2 class="h2">Îți lipsesc și le are cineva</h2></div><div class="list">${mine.map(card).join("")}</div></section>` : ""}
      ${Object.entries(groups).map(([g, l]) => { const rest = l.filter(r => !mine.includes(r)); return rest.length ? `<section class="section"><div class="group-title"><h2 class="h2">${esc(g)}</h2><span class="count muted small">${rest.length}</span></div><div class="list">${rest.map(card).join("")}</div></section>` : ""; }).join("")}`
      : '<div class="block empty"><b>Nimeni n-a pus nimic la „De dat” încă</b>Când cineva bifează ceva ce are în plus, apare aici, cu numele lui.</div>';
  } else if (t === "needs"){
    const rows = S.items.map(i => ({ i, need: list.filter(p => st(p, i.id).need), lend: people().filter(p => st(p, i.id).lend) }))
      .filter(r => r.need.length).sort((a, b) => b.need.length - a.need.length);
    body = rows.length ? `<p class="muted">Cine caută ceva și cine are în plus. Vorbiți pe grupul de WhatsApp.</p><div class="list">${rows.map(r => `<div class="need-card"><b>${esc(r.i.name)}</b>
        <div class="pair"><span class="k">Caută</span><span class="chips">${r.need.map(p => personBtn(p, "need")).join("")}</span>
        <span class="k">Are în plus</span><span class="chips">${r.lend.length ? r.lend.map(p => personBtn(p, "lend")).join("") : '<span class="muted small">nimeni încă</span>'}</span></div></div>`).join("")}</div>`
      : '<div class="block empty"><b>Nimeni nu caută nimic</b>Când cineva apasă „Am nevoie” la un obiect, apare aici.</div>';
  } else {
    const n = list.length;
    const groups = {};
    for (const it of S.items) (groups[isTeam(it) ? "De echipă" : groupOf(it)] ??= []).push(it);
    body = n ? Object.entries(groups).map(([g, its]) => `<section class="section"><div class="group-title"><h2 class="h2">${esc(g)}</h2></div><div class="list">${its.map(i => {
      if (isTeam(i) && S.teams.length){
        const lines = S.teams.map(tm => { const b = membersOf(tm.id).filter(p => has(p, i.id)); return `<span class="small ${b.length ? "" : "muted"}">${esc(tm.name)}: ${b.length ? `aduce ${esc(b.map(shortName).join(", "))}` : (isOpt(i) ? "nimeni" : '<b style="color:var(--need)">nimeni încă</b>')}</span>`; }).join("");
        return `<div class="need-card"><b>${esc(i.name)}</b>${lines}</div>`;
      }
      const h = list.filter(p => has(p, i.id)), miss = list.filter(p => !has(p, i.id) && !st(p, i.id).skip);
      return `<div class="need-card"><div class="block-head"><b>${esc(i.name)}</b><span class="count muted small">${h.length}/${n}</span></div>
        <span class="bar thin"><i style="width:${h.length / n * 100}%"></i></span>
        ${miss.length && miss.length < n ? `<span class="small muted">Nu au bifat: ${esc(miss.map(shortName).join(", "))}</span>` : ""}</div>`; }).join("")}</div></section>`).join("")
      : '<div class="block empty">Nimeni aici.</div>';
  }
  return `<h1 class="h1">Grupul</h1>${seg}${filter}${body}`;
}
function peopleRows(list, req){
  const q = S.q.trim().toLowerCase();
  if (q) list = list.filter(p => p.name.toLowerCase().includes(q));
  return list.map(p => { const h = req - missingOf(p).length, car = carOf(p.id), tm = teamOf(p.id);
    return `<button class="person" data-person="${esc(p.id)}">${avatar(p)}<span class="t"><b>${esc(p.name)}${p.id === S.uid ? " (tu)" : ""}</b>
      <span>${esc(tm ? tm.name : "fără echipă")} · ${car ? (car.owner === p.id ? "șofer" : "are loc") : ownWay(p) ? "pe cont propriu" : "fără loc"}</span></span>
      <span class="r">${h === req ? '<span class="chip ready">Gata</span>' : `${h}/${req}<span class="bar thin"><i style="width:${req ? h / req * 100 : 0}%"></i></span>`}</span></button>`; }).join("")
    || '<div class="empty">Nimeni cu numele ăsta.</div>';
}

/* plain-text summary for WhatsApp / 4M */
function summaryText(){
  const L = [];
  L.push(`XCC ${S.cfg.start_date ? dateRange(S.cfg.start_date, 3) : "2026"} — ${plural(people().length, "om", "oameni")}`);
  if (S.teams.length){ L.push("", "ECHIPE");
    for (const t of S.teams){ const m = membersOf(t.id), g = teamGaps(t.id); L.push(`${t.name}: ${m.map(p => p.name).join(", ") || "—"}${g.length ? ` (lipsesc: ${g.map(i => i.name).join(", ")})` : ""}`); }
    const nt = people().filter(p => !teamOf(p.id)); if (nt.length) L.push(`Fără echipă: ${nt.map(p => p.name).join(", ")}`); }
  L.push("", "MAȘINI");
  for (const c of S.cars){ L.push(`${byId(c.owner)?.name || "?"}${c.from_city ? `, din ${c.from_city}` : ""}${c.when_text ? `, ${c.when_text}` : ""}: ${ridersOf(c).map(p => p.name).join(", ") || "—"}${freeOf(c) ? ` (+${freeOf(c)} libere)` : ""}`); }
  if (!S.cars.length) L.push("—");
  const nr = noRide(); if (nr.length) L.push(`Fără loc: ${nr.map(p => p.name).join(", ")}`);
  const own = people().filter(ownWay); if (own.length) L.push(`Pe cont propriu: ${own.map(p => p.name).join(", ")}`);
  const notReady = people().filter(p => missingOf(p).length);
  if (notReady.length){ L.push("", "LE LIPSEȘTE (obligatoriu)"); for (const p of notReady){ const m = missingOf(p); L.push(`${p.name}: ${m.length > 6 ? `${m.length} lucruri` : m.map(i => i.name).join(", ")}`); } }
  return L.join("\n");
}

          <span>${esc(teamOf(p.id)?.name || "fără echipă")} · ${m ? `îi lipsesc ${m}` : "gata"} · ${car ? (car.owner === p.id ? "șofer" : "are loc") : ownWay(p) ? "pe cont propriu" : "fără loc"}</span></span><span class="chev" aria-hidden="true">›</span></button>`; }).join("") || '<div class="empty">Nimeni aici.</div>'}</div>

/* ---------- sheets ---------- */
function openSheet(kind, data){
  if (!S.sheet){ try { history.pushState({ sheet: true }, "", location.href); } catch {} }
  else if (S.sheet.kind === "item") saveNoteDraft();
  S.sheet = { kind, data }; renderSheet(true);
}
function closeSheet(fromHistory){
  if (!S.sheet) return;
  if (S.sheet.kind === "item") saveNoteDraft();
  S.sheet = null; $("sheetWrap").hidden = true; document.body.style.overflow = ""; document.body.classList.remove("sheet-open");
  if (!fromHistory){ try { if (history.state?.sheet) history.back(); } catch {} }
}
function saveNoteDraft(){
  const ta = $("noteText"), id = S.sheet?.data;
  if (!ta || !id) return;
  const n = ta.value.trim();
  if (n !== st(S.me, id).note) setItem(id, { note: n }, true);
}
const sw = (attrs, label, sub, on, cls = "") => `<button type="button" class="check-row" role="switch" aria-checked="${on}" ${attrs}><span class="lbl"><b>${label}</b>${sub ? `<span>${sub}</span>` : ""}</span><span class="toggle ${cls}" aria-hidden="true"></span></button>`;
function sheetHtml(){
  const { kind, data } = S.sheet;
  const head = (title, sub) => `<div class="sheet-head"><div style="flex:1"><h2 class="h2">${title}</h2>${sub ? `<p class="muted small" style="margin-top:4px">${sub}</p>` : ""}</div><button class="x" data-close aria-label="Închide">✕</button></div>`;
  if (kind === "item"){
    const it = itemById(data); if (!it) return head("Obiect șters");
    const s = st(S.me, it.id), team = isTeam(it);
    const lenders = lendersOf(it.id, S.uid);
    return head(esc(it.name), esc(team ? "Echipament de echipă" : `${groupOf(it)}${isOpt(it) ? "" : " · obligatoriu"}`)) + `<div>
      ${sw(`data-flagset="ok"`, team ? "Aduc eu" : "Am", "", s.ok)}
      ${isOpt(it) ? sw(`data-flagset="skip"`, "Nu iau", "E opțional, îl poți lăsa acasă.", s.skip) : ""}
      ${team ? "" : sw(`data-flagset="need"`, "Am nevoie", lenders.length ? `Au în plus: ${esc(lenders.map(shortName).join(", "))}` : "Apare la Grupul › Caută, ca să te ajute cineva.", s.need, "red")}
      ${team ? "" : sw(`data-flagset="lend"`, "Am în plus", "Apare la Grupul › De dat, ca să-l găsească cine îl caută.", s.lend, "blue")}</div>
      <label class="field" style="margin-top:12px"><span>Notă</span><textarea class="input" id="noteText" maxlength="80" placeholder="ex. am doar unul de 35 L">${esc(s.note)}</textarea><small>Se salvează singură.</small></label>
      <button class="btn block-w" data-close style="margin-top:12px">Gata</button>`;
  }
  if (kind === "person"){
    const p = byId(data); if (!p) return head("Persoană");
    const miss = missingOf(p), car = carOf(p.id), tm = teamOf(p.id);
    const chipList = (arr, cls) => arr.length ? `<span class="chips">${arr.map(i => `<span class="chip ${cls}">${esc(i.name)}${st(p, i.id).note ? `: ${esc(st(p, i.id).note)}` : ""}</span>`).join("")}</span>` : "";
    const sec = (label, html) => html ? `<div class="kv"><span>${label}</span>${html}</div>` : "";
    const req = reqItems().length;
    return `<div class="sheet-head">${avatar(p, "lg")}<div style="flex:1"><h2 class="h2">${esc(p.name)}</h2><p class="muted small">${esc(tm ? tm.name : "Fără echipă")}</p></div><button class="x" data-close aria-label="Închide">✕</button></div>
      <div class="stack">
        <div class="prog">${miss.length ? `<div class="big">${req - miss.length}<small>din ${req} obligatorii</small></div>` : '<span class="done-badge">✓ Gata de drum</span>'}<div class="bar ${miss.length ? "" : "full"}"><i style="width:${req ? (req - miss.length) / req * 100 : 0}%"></i></div></div>
        ${sec("Îi lipsește", chipList(miss, ""))}
        ${sec("Caută", chipList(S.items.filter(i => st(p, i.id).need), "need"))}
        ${sec("Are de dat", chipList(S.items.filter(i => st(p, i.id).lend), "lend"))}
        ${sec("Aduce pentru echipă", chipList(teamItems().filter(i => has(p, i.id)), "ok"))}

  if (kind === "aperson"){

    const self = p.id === S.uid, car = S.cars.find(c => c.owner === p.id);

  }

    const tm = S.teams.find(x => x.id === data); if (!tm) return head("Echipă");
    return head("Redenumește echipa") + `<form class="stack" id="teamForm"><label class="field"><span>Nume</span><input class="input" id="tn" value="${esc(tm.name)}" maxlength="40"></label>

  if (kind === "item-edit"){
    const it = data ? itemById(data) : null;

      <label class="field"><span>Unde apare</span><select class="input" id="ic">${cats.map(c => `<option ${c === (it?.cat || "Personal obligatoriu") ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
        <small>„Echipă …” înseamnă că se aduce pentru toată echipa. „Opțional” se poate lăsa acasă.</small></label>

}
/* re-render keeps whatever the person has typed in the sheet */
function renderSheet(first){
  if (!S.sheet) return;
  const body = $("sheetBody"), keep = {};
  if (!first) body.querySelectorAll("input,textarea,select,output").forEach(el => { if (el.id && el.type !== "file") keep[el.id] = el.tagName === "OUTPUT" ? el.textContent : el.value; });
  const focusId = !first && body.contains(document.activeElement) ? document.activeElement.id : null;
  body.innerHTML = `<div class="grab" aria-hidden="true"></div>` + sheetHtml();
  for (const [id, v] of Object.entries(keep)){ const el = $(id); if (!el) continue; if (el.tagName === "OUTPUT") el.textContent = v; else el.value = v; }
  if (focusId && $(focusId)) $(focusId).focus();
  $("sheetWrap").hidden = false; document.body.style.overflow = "hidden"; document.body.classList.add("sheet-open");
  if (first) setTimeout(() => body.querySelector(".x")?.focus({ preventScroll: true }), 30);
}

/* ---------- render ---------- */
function navBadges(){ const m = missingOf(S.me).length; return { gear: m ? (m > 9 ? "9+" : m) : "", transport: carOf(S.uid) || ownWay(S.me) ? "" : "!", admin: pending().length || "" }; }
function renderChrome(inApp){
  document.body.classList.toggle("noapp", !inApp);
  if (!inApp){ $("rail").innerHTML = ""; $("tabbar").innerHTML = ""; $("avatarBtn").innerHTML = ""; return; }
  const b = navBadges();
  const items = [["home", "Acasă", "band"], ["gear", "Echipament", "dot"], ["transport", "Transport", "tri"], ["group", "Grupul", "cross"]];
  if (isAdmin()) items.push(["admin", "Admin", "key"]);
  $("tabbar").innerHTML = items.map(([k, l, m]) => `<button class="tab" data-go="${k}" ${S.page === k ? 'aria-current="page"' : ""}><span class="ic">${marker(m)}${b[k] ? `<span class="dot">${b[k]}</span>` : ""}</span>${l}</button>`).join("");
  $("rail").innerHTML = `<a class="brand" href="#" data-go="home">${marker("band")}XCC</a>`
    + items.map(([k, l, m]) => `<button class="nav" data-go="${k}" ${S.page === k ? 'aria-current="page"' : ""}>${marker(m)}${l}${b[k] ? `<span class="dot">${b[k]}</span>` : ""}</button>`).join("")
    + `<button class="me" data-profile>${avatar(S.me)}<span>${esc(S.me.name)}<small>Contul meu</small></span></button>`;
  $("avatarBtn").innerHTML = avatar(S.me);
}
let lastView = "";
const viewKey = () => [S.uid ? (S.me?.status || "-") : "out", S.recovering, S.authMode, S.page, S.gearTab, S.groupTab, S.adminTab].join("|");
function render(){
  const inApp = !!(S.uid && S.me && approved() && !S.recovering && !S.loadFailed);
  renderChrome(inApp);
  let html;
  if (!S.loaded) html = '<div class="block empty">Se încarcă…</div>';
  else if (S.loadFailed) html = `<div class="block empty"><b>Nu s-au încărcat datele</b>Verifică internetul.<div class="row" style="justify-content:center;margin-top:12px"><button class="btn sec sm" data-retry>Reîncearcă</button></div></div>`;
  else if (!S.uid || S.recovering) html = pageAuth();
  else if (!S.me) html = S.meMissing >= 3 ? `<div class="auth"><div class="block stack"><h2 class="h2">Ceva n-a mers</h2><p class="muted">Contul tău nu s-a putut pregăti. Scrie-i lui Clau.</p><button class="btn sec" data-logout>Ieși din cont</button></div></div>` : '<div class="block empty">Îți pregătim contul…</div>';
  else if (!approved()) html = pagePending();
  else {
    if (S.page === "admin" && !isAdmin()) S.page = "home";
    html = { home: pageHome, gear: pageGear, transport: pageTransport, group: pageGroup, admin: pageAdmin }[S.page]();
  }
  // don't wipe a field the person is typing in
  const a = document.activeElement, typing = a && $("page").contains(a) && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") ? a.id : null;
  if (typing === "q" && $("peopleList") && viewKey() === lastView){ $("peopleList").innerHTML = peopleRows(groupList(), reqItems().length); }
  else if (typing === "listQ" && $("listBody") && viewKey() === lastView){ const tmp = document.createElement("div"); tmp.innerHTML = html; const nb = tmp.querySelector("#listBody"); if (nb) $("listBody").innerHTML = nb.innerHTML; }
  else if (typing && viewKey() === lastView){ /* keep the form as is; it refreshes on the next render */ }
  else $("page").innerHTML = html;
  lastView = viewKey();
  if (S.sheet) renderSheet(false);
}

/* ---------- writes ---------- */
function setItem(itemId, patch, quiet){
  if (!S.me) return;
  const it = itemById(itemId) || {};
  const cur = { ...st(S.me, itemId), ...patch };
  if (patch.ok === true){ cur.need = false; cur.skip = false; }
  if (patch.ok === false && !isOpt(it)) cur.lend = false;
  if (patch.need === true){ cur.ok = false; cur.skip = false; cur.lend = false; }
  if (patch.skip === true){ cur.ok = false; cur.need = false; }
  if (patch.lend === true){ cur.need = false; if (!isOpt(it) && !isTeam(it)) cur.ok = true; }
  const val = { ok: cur.ok, need: cur.need, lend: cur.lend, skip: cur.skip, note: cur.note };
  S.me.items = { ...(S.me.items || {}), [itemId]: val };
  if (!quiet) render();
  return write(() => sb.rpc("set_item", { item_id: itemId, val }));
}
const upd = (id, v, msg) => write(() => sb.from("profiles").update(v).eq("id", id), msg);
const setRide = (uid, carId, msg) => write(() => sb.from("profiles").update({ ride: carId || null }).eq("id", uid), msg);
async function copyText(txt, okMsg){
  try { await navigator.clipboard.writeText(txt); toast(okMsg); }
  catch { toast("Nu am putut copia. Selectează textul și copiază-l manual.", true); }
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target, q = sel => t.closest(sel);
  let b;
  if ((b = q("[data-go]"))){
    e.preventDefault(); const tab = b.dataset.tab, pg = b.dataset.go;
    go(pg, tab ? (pg === "admin" ? { adminTab: tab } : pg === "gear" ? { gearTab: tab } : pg === "group" ? { groupTab: tab } : {}) : {});
    return;
  }
  if (q("[data-close]") || t.classList.contains("sheet-scrim")){ closeSheet(); return; }
  if (q("[data-retry]")){ S.loaded = false; S.loadFailed = false; render(); loadAll(); return; }
  if ((b = q("[data-auth]"))){
    const em = $("le")?.value || $("se")?.value; if (em) S.checkEmail = em.trim();
    S.authMode = b.dataset.auth; render(); return;
  }
  if ((b = q("[data-pw]"))){ const i = b.parentElement.querySelector("input"); i.type = i.type === "password" ? "text" : "password"; b.textContent = i.type === "password" ? "Arată" : "Ascunde"; return; }
  if (q("[data-logout]")){ closeSheet(); await sb.auth.signOut(); return; }
  if (q("[data-welcome]")){ lsSet("xcc-welcome", "1"); render(); return; }
  if ((b = q("[data-resend]"))){
    await busy(b, async () => {
      const r = S.authMode === "sent" ? await sb.auth.resetPasswordForEmail(S.checkEmail, { redirectTo: SITE }) : await sb.auth.resend({ type: "signup", email: S.checkEmail, options: { emailRedirectTo: SITE } });
      toast(r?.error ? authErr(r.error.message) : "Am retrimis emailul.", !!r?.error);
    }); return;
  }
  if (q("[data-profile]") || q("#avatarBtn")){ if (S.me) openSheet("profile"); return; }
  if ((b = q("[data-gtab]"))){ go("gear", { gearTab: b.dataset.gtab }); return; }
  if ((b = q("[data-grtab]"))){ S.groupTab = b.dataset.grtab; try { history.replaceState(null, "", routeHash("group", S.groupTab === "people" ? "" : S.groupTab)); } catch {} render(); return; }
  if ((b = q("[data-atab]"))){ S.adminTab = b.dataset.atab; try { history.replaceState(null, "", routeHash("admin", S.adminTab === "requests" ? "" : S.adminTab)); } catch {} render(); return; }
  if ((b = q("[data-afilter]"))){ S.adminFilter = S.adminFilter === b.dataset.afilter ? "all" : b.dataset.afilter; render(); return; }
  if (q("[data-missing]")){ S.onlyMissing = !S.onlyMissing; render(); return; }
  if ((b = q("[data-team-filter]"))){ S.groupTeam = b.dataset.teamFilter; render(); return; }
  if ((b = q("[data-toggle]"))){
    const id = b.dataset.toggle, on = !st(S.me, id).ok;
    if (S.onlyMissing && on){ S.leaving[id] = true; setTimeout(() => { delete S.leaving[id]; render(); }, 700); }
    setItem(id, { ok: on });
    const row = document.querySelector(`[data-row="${CSS.escape(id)}"]`); if (row && on){ row.classList.add("pop"); setTimeout(() => row.classList.remove("pop"), 160); }
    if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
    return;
  }
  if ((b = q("[data-want]"))){ const on = b.dataset.want === "1"; setItem(b.dataset.id, { need: on }); toast(on ? "Ai cerut. Spune-le și pe WhatsApp." : "Cerere anulată"); return; }
  if ((b = q("[data-extra]"))){ const id = b.dataset.extra, on = !st(S.me, id).lend; setItem(id, { lend: on }); toast(on ? "Pus la „De dat”" : "Scos de la „De dat”"); return; }
  if ((b = q("[data-more]"))){ openSheet("item", b.dataset.more); return; }

    const id = S.sheet?.data, key = b.dataset.flagset, on = b.getAttribute("aria-checked") !== "true";

    setItem(id, { [key]: on });
    return;
  }

  if ((b = q("[data-aview]"))){ openSheet("person", b.dataset.aview); return; }

  if (q("[data-car-new]")){ openSheet("car", null); return; }
  if ((b = q("[data-car-edit]"))){ openSheet("car", { ...S.cars.find(c => c.id === b.dataset.carEdit) }); return; }
  if ((b = q("[data-step]"))){ const o = $("cf-seats"), v = Math.max(Number(o.dataset.min) || 0, Math.min(8, Number(o.textContent) + Number(b.dataset.step))); o.textContent = v; return; }
  if ((b = q("[data-join]"))){ const c = S.cars.find(x => x.id === b.dataset.join); await busy(b, () => upd(S.uid, { ride: b.dataset.join, own_transport: false }, `Ai loc la ${nameOf(c?.owner)}`)); return; }
  if (q("[data-leave]")){ await setRide(S.uid, null, "Ai renunțat la loc"); return; }

  if ((b = q("[data-unseat]"))){ await setRide(b.dataset.unseat, null, `${nameOf(b.dataset.unseat)} nu mai e în mașină`); return; }
  if ((b = q("[data-car-del]"))){ if (!arm(b, "Apasă încă o dată ca să ștergi")) return; if (await write(() => sb.from("cars").delete().eq("id", b.dataset.carDel), "Mașina a fost ștearsă")) closeSheet(); return; }
  if (q("[data-assign]")){ openSheet("assign"); return; }
