<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>XCC</title>
<meta name="description" content="Echipament, transport și echipe pentru Xtreme Character Challenge.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='4' fill='white' stroke='%23ccc'/%3E%3Crect x='2' y='8.5' width='20' height='7' fill='%23D0161E'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='white'/%3E%3Crect y='8' width='24' height='8' fill='%23D0161E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* XCC — trail-marker field app in 4M colours.
   Black chrome, neutral white/grey ground. Red = brand (markers, active nav, primary button) and alarm
   (missing / need). Ink = done & progress. Blue = extra to give. Green only for "fully ready".
   Phone: black top bar + bottom tab bar. Desktop (>=960px): black left rail + content column. */
:root{
  --bg:#F3F3F3; --surface:#FFFFFF; --surface-2:#F6F6F6; --line:#DCDCDC; --line-2:#C4C4C4; --ctrl:#8A8A8A;
  --text:#111111; --muted:#555555; --faint:#6B6B6B;
  --brand:#000000; --brand-2:#1C1C1C; --on-brand:#FFFFFF; --on-brand-muted:#A3A3A3;
  --accent:#CF171F; --accent-press:#A8121A; --on-accent:#FFFFFF;
  --ok:#111111; --ok-soft:#ECECEC; --ready:#1F6F43; --ready-soft:#E3F1E8;
  --need:#B4141B; --need-strong:#B4141B; --need-soft:#FDE7E8; --lend:#1D4E89; --lend-soft:#E6EEF8;
  --skip:#666666; --skip-soft:#F0F0F0; --warn:#8A5300; --warn-soft:#FBEBCD;
  --seg-on:#FFFFFF;
  --marker-bg:#FFFFFF; --marker-edge:#C4C4C4; --marker-red:#CF171F;
  --shadow-sheet:0 -12px 40px rgba(0,0,0,.22);
  --font-d:"Big Shoulders Display","Big Shoulders","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --font-b:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-s:6px; --r-m:10px; --r-l:12px;
  --tabbar-h:64px; --topbar-h:56px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C0C0D; --surface:#17171A; --surface-2:#1F1F23; --line:#33333A; --line-2:#5A5A63; --ctrl:#7A7A84;
  --text:#F4F4F5; --muted:#A1A1AA; --faint:#8B8B94;
  --brand:#000000; --brand-2:#1C1C1E; --on-brand:#FFFFFF; --on-brand-muted:#A1A1AA;
  --accent:#E5252C; --accent-press:#CF171F; --on-accent:#FFFFFF;
  --ok:#F4F4F5; --ok-soft:#27272A; --ready:#5CC48A; --ready-soft:#16301F;
  --need:#FF6B70; --need-strong:#C81A21; --need-soft:#3A1415; --lend:#8AB4F0; --lend-soft:#15233A;
  --skip:#A1A1AA; --skip-soft:#232326; --warn:#F2B65C; --warn-soft:#3A2B12;
  --seg-on:#34343A;
  --marker-bg:#E8E8EA; --marker-edge:transparent; --marker-red:#CF171F;
  --shadow-sheet:0 -12px 40px rgba(0,0,0,.6),0 -1px 0 #3A3A42;
  color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.5 var(--font-b);-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--lend)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,.prog .big,.person .r,.count-pill b,.dot,.seg .n,.count{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- trail markers ---------- */
.mk{width:24px;height:24px;flex:none;display:block}
.mk rect.bg{fill:var(--marker-bg);stroke:var(--marker-edge)}
.mk .red{fill:var(--marker-red)}
.mk .ink{fill:#111}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--brand);color:var(--on-brand);padding:env(safe-area-inset-top,0px) 16px 0}
@media (prefers-color-scheme:dark){.topbar{box-shadow:0 1px 0 var(--line)}}
.topbar .in{height:var(--topbar-h);display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font:800 1.5rem/1 var(--font-d);letter-spacing:.03em}
.avatar-btn{margin-left:auto;background:none;border:0;padding:5px;border-radius:999px;min-width:44px;min-height:44px}
.av{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;font:700 .82rem var(--font-b);color:#fff;flex:none}
.av.lg{width:52px;height:52px;font-size:1.05rem}
.shell{max-width:760px;margin:0 auto;padding:18px 16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  padding:0 4px env(safe-area-inset-bottom,0px);display:flex;justify-content:space-around}
.tab{flex:1;max-width:120px;height:var(--tabbar-h);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted);font:600 .74rem var(--font-b);position:relative}
.tab .ic{position:relative;display:block}
.tab:not([aria-current="page"]) .mk{opacity:.8}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .dot{position:absolute;top:-7px;left:15px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font:700 .66rem/18px var(--font-b);box-shadow:0 0 0 2px var(--surface);text-align:center}
.rail{display:none}
body.noapp .tabbar,body.noapp .avatar-btn{display:none}

@media (min-width:960px){
  .topbar{display:none}
  body:not(.noapp) .rail{display:flex;position:fixed;inset:0 auto 0 0;width:248px;flex-direction:column;background:var(--brand);color:var(--on-brand);padding:22px 14px;gap:4px;z-index:40;border-right:1px solid var(--brand-2)}
  .rail .brand{padding:0 8px 18px}
  .rail .nav{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--on-brand-muted);font:600 .98rem var(--font-b);padding:11px 10px;border-radius:8px;text-align:left}
  .rail .nav:hover{background:var(--brand-2);color:var(--on-brand)}
  .rail .nav[aria-current="page"]{background:var(--brand-2);color:var(--on-brand);box-shadow:inset 3px 0 0 var(--accent)}
  .rail .nav .dot{margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;font:700 .72rem/20px var(--font-b);min-width:20px;padding:0 6px;text-align:center}
  .rail .me{margin-top:auto;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--on-brand);padding:10px;border-radius:8px;text-align:left}
  .rail .me:hover{background:var(--brand-2)}
  .rail .me span small{display:block;color:var(--on-brand-muted);font-size:.8rem}
  .tabbar{display:none}
  body:not(.noapp) .shell{margin-left:248px;max-width:none;padding:34px 48px 60px}
  body:not(.noapp) .page{max-width:760px;margin:0 auto}
  body.noapp .topbar{display:block}
  body.noapp .shell{margin:0 auto}
  :root{--topbar-h:0px}
}
.page{display:flex;flex-direction:column;gap:20px}

/* ---------- type ---------- */
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font:800 clamp(2.5rem,10vw,3.3rem)/.95 var(--font-d);letter-spacing:.005em}
.h2{font:800 1.8rem/1.05 var(--font-d);letter-spacing:.01em}
.h3{font:700 1.05rem/1.3 var(--font-b)}
.lead{margin:0;color:var(--muted);max-width:60ch}
.muted{color:var(--muted)}
.small{font-size:.875rem}
p{margin:0}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:var(--r-l);overflow:hidden;min-height:clamp(210px,44vw,320px);background:#111;color:#fff;display:flex;align-items:flex-end;isolation:isolate}
.hero > img,.hero > svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;z-index:-2}
.hero > img{object-position:right top}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.3) 0%,rgba(0,0,0,.28) 38%,rgba(0,0,0,.86) 100%)}
.hero h1,.hero p{text-shadow:0 2px 14px rgba(0,0,0,.4)}
.hero .txt{padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.hero h1{font:900 clamp(2.5rem,11vw,4.2rem)/.86 var(--font-d);letter-spacing:.01em;text-transform:uppercase}
.hero p{color:#ECECEC;font-weight:600}
.count-pill{align-self:flex-start;display:inline-flex;align-items:baseline;gap:6px;background:#FFFFFF;color:#111;border-radius:var(--r-s);padding:4px 12px 4px 4px;font-weight:600;font-size:.9rem}
.count-pill b{background:var(--marker-red);color:#fff;border-radius:4px;padding:1px 9px;font:800 1.1rem/1.4 var(--font-d)}

/* ---------- blocks ---------- */
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.block.flush{padding:0;overflow:hidden}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.block-head > :first-child{min-width:0}
.block-head > :last-child{flex:none}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.section{display:flex;flex-direction:column;gap:10px}
.warnline{display:flex;gap:10px;align-items:flex-start;color:var(--need);font-weight:600;font-size:.92rem}
.warnline svg{flex:none;margin-top:2px}

/* next steps */
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.steps li:first-child .step{border-top:0}
.step .st{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;flex:none;font-weight:800;font-size:.9rem;margin-top:1px}
.st.todo{background:var(--need-soft);color:var(--need)}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.ready{background:var(--ready-soft);color:var(--ready)}
.st.wait{background:transparent;color:var(--skip);border:2px dashed var(--line-2)}
.st.help{background:var(--lend-soft);color:var(--lend)}
.step .t{flex:1;min-width:0}
.step .t b{display:block;font-weight:700}
.step .t span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.9rem}
.step .chev{color:var(--faint);font-size:1.3rem;align-self:center}
.welcome{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.welcome ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.welcome .muted{color:var(--on-brand-muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r-s);border:1px solid transparent;font-weight:700;font-size:1rem;background:var(--accent);color:var(--on-accent);text-decoration:none;white-space:nowrap}
.btn:active{background:var(--accent-press)}
.btn.sec{background:var(--surface);border-color:var(--line-2);color:var(--text)}
.btn.sec:active{background:var(--surface-2)}
.btn.ink{background:var(--text);color:var(--surface)}
.btn.ink:active{opacity:.85}
.btn.ghost{background:transparent;color:var(--text);border-color:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.ghost:active{background:var(--surface-2)}
.btn.danger{background:transparent;border-color:var(--need);color:var(--need)}
.btn.danger:active{background:var(--need-soft)}
.btn.sm{min-height:42px;padding:0 14px;font-size:.92rem}
.btn.block-w{width:100%}
.btn:disabled,.btn[aria-busy="true"]{opacity:1;background:var(--line);color:var(--muted);border-color:transparent;cursor:not-allowed}
.btn.armed{background:var(--need-strong);color:#fff;border-color:var(--need-strong)}
@media (hover:hover){.btn:not(:disabled):hover{filter:brightness(.94)}.it-main:hover,.person:hover,.step:hover,.check-row:hover{background:var(--surface-2)}}
.pair-btns{display:flex;gap:10px;flex-wrap:wrap}
.pair-btns > .btn{flex:1 1 140px}

/* segmented */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:3px;gap:3px}
.seg button{flex:1 1 0;min-width:0;min-height:44px;border:0;background:none;border-radius:7px;font-weight:700;color:var(--muted);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-selected="true"]{background:var(--seg-on);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line-2)}
.seg.tight button{font-size:.84rem;padding:0 4px}
.seg .n{display:inline-block;margin-left:5px;background:var(--accent);color:#fff;border-radius:999px;font-size:.72rem;padding:0 6px;line-height:18px}
.sticky-seg{position:sticky;top:calc(var(--topbar-h) + env(safe-area-inset-top,0px));z-index:30;padding:6px 0;margin:-6px 0;background:var(--bg)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.84rem;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.need{background:var(--need-soft);color:var(--need);border-color:transparent}
.chip.lend{background:var(--lend-soft);color:var(--lend);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.ready{background:var(--ready-soft);color:var(--ready);border-color:transparent}
.chip.skip{background:var(--skip-soft);color:var(--skip);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ghostchip{background:transparent;border-style:dashed;color:var(--faint)}
button.chip{cursor:pointer;min-height:36px;padding:0 14px}
button.chip[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
a.chip,button.chip.link{text-decoration:none;cursor:pointer}
.chip.link{min-height:auto;padding:3px 10px}

/* progress */
.prog{display:flex;flex-direction:column;gap:10px}
.prog .big{font:800 2.6rem/1 var(--font-d)}
.prog .big small{font:600 1rem var(--font-b);color:var(--muted);margin-left:6px}
.prog .big.alarm{color:var(--need)}
.bar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .35s ease}
.bar.full i{background:var(--ready)}
.bar.thin{height:6px;border:0;background:var(--line)}
.done-badge{display:inline-flex;align-items:center;gap:8px;background:var(--ready);color:#fff;font-weight:700;border-radius:999px;padding:6px 14px;align-self:flex-start}
@media (prefers-color-scheme:dark){.done-badge{color:#0C0C0D}}

/* checklist rows */
.group-title{display:flex;align-items:baseline;gap:10px;margin:8px 2px 0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.it{display:flex;align-items:flex-start;border-top:1px solid var(--line);transition:opacity .4s}
.it:first-child{border-top:0}
.it.leaving{opacity:.35}
.it-main{flex:1;min-width:0;display:flex;align-items:flex-start;gap:14px;padding:14px 6px 14px 14px;background:none;border:0;text-align:left;min-height:56px}
.it-main:active{background:var(--surface-2)}
.it-main:focus-visible,.it-more:focus-visible,.person:focus-visible,.step:focus-visible,.check-row:focus-visible{outline-offset:-3px}
.box{width:26px;height:26px;border-radius:6px;border:2px solid var(--ctrl);flex:none;display:grid;place-items:center;margin-top:-1px;color:var(--surface);transition:background .15s,border-color .15s,transform .15s}
.box svg{width:16px;height:16px;opacity:0}
.it.on .box{background:var(--ok);border-color:var(--ok)}
.it.on .box svg{opacity:1}
.it.lendrow.on .box{background:var(--lend);border-color:var(--lend);color:#fff}
.it.pop .box{transform:scale(1.15)}
.it.skip .box{background:var(--skip-soft);border-color:var(--line-2);border-style:dashed}
.it-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.it-name{font-weight:600;line-height:1.35}
.it.on .it-name,.it.skip .it-name{color:var(--muted)}
.it.skip .it-name{text-decoration:line-through}
.it-more{width:52px;height:56px;flex:none;background:none;border:0;color:var(--muted);font-size:1.25rem;letter-spacing:1px}
.it-more:active{background:var(--surface-2)}
.it-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px 54px;margin-top:-6px}
.empty{padding:22px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:1.05rem;margin-bottom:4px}
.note-inline{color:var(--muted);font-size:.88rem;font-style:italic}

/* people */
.person{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit;text-decoration:none}
.list .person:first-child{border-top:0}
.person:active{background:var(--surface-2)}
.person .t{flex:1;min-width:0}
.person .t b{display:block;font-weight:700}
.person .t span{color:var(--muted);font-size:.86rem}
.person .r{width:92px;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:.82rem;color:var(--muted);font-weight:600}
.person .r .bar{width:100%}
.person .chev{color:var(--faint);font-size:1.3rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px}
.tile b{font:800 1.8rem/1 var(--font-d)}
.tile span{font-size:.8rem;color:var(--muted);font-weight:600}
.tile[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.tile.alarm b{color:var(--need)}

/* needs */
.need-card{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.list .need-card:first-child{border-top:0}
.pair{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;font-size:.92rem}
.pair .k{color:var(--muted);padding-top:3px}

/* cars */
.car{display:flex;flex-direction:column;gap:12px}
.car-route{color:var(--muted);font-size:.92rem}
.seats{display:flex;flex-wrap:wrap;gap:8px}
.seat{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.88rem;font-weight:600;color:var(--text)}
button.seat{cursor:pointer}
.seat .av{width:26px;height:26px;font-size:.7rem;box-shadow:0 0 0 1.5px var(--line-2)}
.seat.free{border-style:dashed;border-color:var(--line-2);color:var(--faint);background:transparent;padding-left:12px}
.seat.me{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seat .role{color:var(--muted);font-weight:500}
.mycar{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
@media (prefers-color-scheme:dark){.mycar{border-color:var(--line-2)}}
.mycar .muted,.mycar .car-route{color:var(--on-brand-muted)}
.mycar .car-route b{color:#fff}
.mycar .seat{background:var(--brand-2);border-color:#3F3F46;color:#fff}
.mycar .seat .role{color:var(--on-brand-muted)}
.mycar .seat.free{background:transparent;color:var(--on-brand-muted);border-color:#555}
.mycar .btn.sec{background:transparent;color:var(--on-brand);border-color:#666}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--surface);font-size:1.4rem;font-weight:700}

function authErr(m = ""){

  if (/fetch|network|Failed/i.test(m)) return "Nu ai internet. Verifică semnalul și încearcă din nou.";
  if (/same|different/i.test(m)) return "Alege altă parolă decât cea veche.";

let lastSnap = "";
async function loadAll(){
  try {
    const cfg = await sb.from("config").select("*").eq("id", 1).maybeSingle();
    if (!cfg.error) S.cfg = cfg.data || {};
    if (S.uid){
      const [pr, it, tm, cr, ro, tn] = await Promise.all([
        sb.from("profiles").select("*").order("created_at"),
        sb.from("items").select("*").order("ord"),
        sb.from("teams").select("*").order("created_at"),
        sb.from("cars").select("*").order("created_at"),
        sb.from("roster").select("*").order("name"),
        sb.from("tents").select("*").order("created_at"),
      ]);
      const err = pr.error || it.error || tm.error || cr.error;
      if (err) throw err;
      const snap = JSON.stringify([cfg.data, pr.data, it.data, tm.data, cr.data, ro.error ? null : ro.data, tn.error ? null : tn.data]);
      if (snap === lastSnap && S.loaded && !S.loadFailed){ return; }
      lastSnap = snap;
      S.profiles = pr.data || []; S.items = it.data || []; S.teams = tm.data || []; S.cars = cr.data || []; S.roster = ro.error ? [] : (ro.data || []); S.tents = tn.error ? [] : (tn.data || []);
      S.me = S.profiles.find(p => p.id === S.uid) || null;
      S.meMissing = S.me ? 0 : S.meMissing + 1;
      if (!S.me && S.meMissing < 3) scheduleReload(1500);
    }
    S.loadFailed = false;
  } catch(e){
    console.error(e);
    if (S.loaded && !S.loadFailed) toast("Fără conexiune. Vezi ultimele date salvate.", true);
    else S.loadFailed = true;
  }
  S.loaded = true;
  render();
}
let reloadT;
function scheduleReload(ms = 400){ clearTimeout(reloadT); reloadT = setTimeout(loadAll, ms); }
let channel;
function subscribe(){
  if (!sb.channel) return;
  if (channel) sb.removeChannel(channel);

function routeHash(page, tab){ return page === "home" ? location.pathname + location.search : `#${page}${tab ? "/" + tab : ""}`; }
function go(page, opts = {}, push = true){
  if (!PAGES.includes(page) || (page === "admin" && !isAdmin())) page = "home";
  const changed = page !== S.page || opts.gearTab || opts.adminTab || opts.groupTab;
  Object.assign(S, opts);
  if (S.sheet) closeSheet(true);
  if (page !== "transport") S.board = false;
  S.page = page;
  const tab = page === "gear" ? S.gearTab : page === "admin" ? S.adminTab : page === "group" ? S.groupTab : "";
  try { if (push && changed) history.pushState({ page }, "", routeHash(page, ["mine", "requests", "people"].includes(tab) ? "" : tab)); } catch {}
  render(); window.scrollTo({ top: 0 });
}
function readHash(){

function itemRow(it, kind){

  const chips = [];
  if (kind === "team"){
    const others = (teamOf(S.uid) ? mates() : []).filter(p => p.id !== S.uid && has(p, it.id));
    if (others.length) chips.push(`<span class="chip ok">Aduce ${esc(others.map(shortName).join(", "))}</span>`);
  }
  if (s.need){
    const l = lendersOf(it.id, S.uid);
    if (l.length) chips.push(`<span class="chip lend">Are în plus:</span>${l.map(p => personBtn(p, "lend")).join("")}`);
  }

  if (s.skip) chips.push('<span class="chip skip">Nu iau</span>');
  return `<div class="it ${on ? "on" : ""} ${s.skip ? "skip" : ""} ${leaving ? "leaving" : ""}" data-row="${esc(it.id)}">

  steps.push(miss.length

  if (asked.length) steps.push({ go: "group", tab: "give", cls: "help", ic: asked.length, t: asked.length === 1 ? `Ai cerut ${asked[0].name} și îl are cineva` : `Ai cerut ${asked.length} lucruri și le are cineva`, s: asked.map(i => `${i.name}: ${lendersOf(i.id, S.uid).map(shortName).join(", ")}`).join(" · ") });
  else if (canBorrow.length) steps.push({ go: "group", tab: "give", cls: "help", ic: canBorrow.length, t: `Poți împrumuta: ${canBorrow.slice(0, 2).map(i => i.name).join(", ")}${canBorrow.length > 2 ? "…" : ""}`, s: "Le are cineva în plus. Apasă „Îl vreau”." });
  if (isAdmin() && pending().length) steps.push({ go: "admin", tab: "requests", cls: "todo", ic: pending().length, t: `${plural(pending().length, "cerere nouă", "cereri noi")} de aprobat`, s: pending().map(x => x.name).join(", ") });
  steps.push(car
    ? { go: "transport", cls: "done", ic: "✓", t: car.owner === S.uid ? "Conduci" : `Mergi cu ${nameOf(car.owner)}`, s: [departWhen(car), car.meet_point || car.from_city].filter(Boolean).join(" · ") || "Detalii la Transport" }
    : ownWay(p) ? { go: "transport", cls: "done", ic: "✓", t: "Vii pe cont propriu", s: "Dacă se schimbă ceva, alege un loc la Transport." }
    : { go: "transport", cls: "todo", ic: "!", t: "Încă n-ai loc într-o mașină", s: S.cars.length ? `${plural(S.cars.reduce((n, c) => n + freeOf(c), 0), "loc liber", "locuri libere")} acum` : "Ai mașină? Adaug-o." });
  if (!team) steps.push({ go: "team", cls: "wait", ic: "", t: "Aștepți repartizarea pe echipe", s: "Clau te pune în echipă după lista de la 4M." });

  const nOffer = othersExtra().length;

  const declNotice = S.cfg.doc_url && !declOk(p) ? `<div class="block decl stack" role="region" aria-label="Declarația pe propria răspundere"><span class="kicker">Obligatoriu pentru toți</span>

  return `${hero(!!welcome)}${declNotice}${depart}${welcome}
    <div class="section"><h2 class="h2">Salut, ${esc(firstName(p.name))}</h2>

async function moveGuest(gid, zoneId){
  const g = guestBy(gid); S.pick = null; if (!g){ render(); return; }
  const car = zoneId === "pool" || zoneId === "own" ? null : S.cars.find(x => x.id === zoneId);
  if ((car ? car.id : null) === (S.cars.some(c => c.id === g.ride) ? g.ride : null)){ render(); return; }
  if (car && !freeOf(car)){ toast("Mașina e plină.", true); render(); return; }
  g.ride = car ? car.id : null; render();
  document.querySelector(`[data-dnd="g:${CSS.escape(g.id)}"]`)?.focus({ preventScroll: true });
  await write(() => sb.rpc("seat_guest", { guest: g.id, car: car ? car.id : null }), `${firstName(g.name)}: ${car ? `la ${nameOf(car.owner)}` : "fără loc"}`);
}
async function moveTo(pid, zoneId){
  if (String(pid).startsWith("g:")) return moveGuest(pid, zoneId);
  const p = byId(pid); if (!p) return;
  if ((zoneId === "pool" && !carOf(pid) && !ownWay(p)) || (zoneId === "own" && ownWay(p) && !carOf(pid)) || p.ride === zoneId){ S.pick = null; render(); return; }
  if (zoneId !== "pool" && zoneId !== "own"){
    const c = S.cars.find(x => x.id === zoneId); if (!c) return;
    if (p.ride === c.id) return;
    if (!freeOf(c)){ toast("Mașina e plină.", true); return; }
  }
  const patch = zoneId === "pool" ? { ride: null, own_transport: false } : zoneId === "own" ? { ride: null, own_transport: true } : { ride: zoneId, own_transport: false };
  Object.assign(p, patch); S.pick = null; render();
  document.querySelector(`[data-dnd="${CSS.escape(pid)}"]`)?.focus({ preventScroll: true });
  const where = zoneId === "pool" ? "fără loc" : zoneId === "own" ? "pe cont propriu" : `la ${nameOf(S.cars.find(x => x.id === zoneId)?.owner)}`;
  await upd(pid, patch, `${shortName(p)}: ${where}`);
}
/* pointer-based drag so it works with a finger as well as a mouse */
(function(){
  let drag = null;
  const zoneAt = (x, y) => document.elementFromPoint(x, y)?.closest("[data-zone]");
  document.addEventListener("pointerdown", e => {
    const el = e.target.closest("[data-dnd]"); if (!el || e.button > 0) return;
    drag = { id: el.dataset.dnd, el, x: e.clientX, y: e.clientY, on: false, ghost: null, over: null };
  });
  document.addEventListener("pointermove", e => {
    if (!drag) return;
    if (!drag.on){
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
      drag.on = true; S.pick = null;
      const g = drag.el.cloneNode(true); g.classList.add("ghost"); document.body.appendChild(g); drag.ghost = g;
      drag.el.classList.add("dragging"); document.body.classList.add("is-dragging");
    }
    e.preventDefault();
    drag.ghost.style.transform = `translate(${e.clientX - 30}px, ${e.clientY - 22}px)`;
    const z = zoneAt(e.clientX, e.clientY);
    if (z !== drag.over){ drag.over?.classList.remove("over"); z?.classList.add("over"); drag.over = z; }
    drag.y = e.clientY; if (!drag.raf){ const tick = () => { if (!drag?.on){ return; } const edge = 80; if (drag.y < edge) window.scrollBy(0, -14); else if (drag.y > innerHeight - edge) window.scrollBy(0, 14); drag.raf = requestAnimationFrame(tick); }; drag.raf = requestAnimationFrame(tick); }
  }, { passive: false });
  const end = e => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.on) return;
    d.ghost?.remove(); d.el.classList.remove("dragging"); document.body.classList.remove("is-dragging"); d.over?.classList.remove("over");
    const z = zoneAt(e.clientX, e.clientY);
    window.__xccSuppressClick = Date.now();
    if (z) moveTo(d.id, z.dataset.zone);
  };
  document.addEventListener("pointerup", end);
  document.addEventListener("pointercancel", e => { if (drag?.on){ drag.ghost?.remove(); drag.el.classList.remove("dragging"); document.body.classList.remove("is-dragging"); drag.over?.classList.remove("over"); } drag = null; });
})();

/* departure details of a car: "Jo 5 nov, 14:00" etc. */
const ZILE = ["Du", "Lu", "Ma", "Mi", "Jo", "Vi", "Sâ"], ZILE_L = ["Duminică", "Luni", "Marți", "Miercuri", "Joi", "Vineri", "Sâmbătă"];
/* the event day and the two days before it, as [iso, "Jo 5 nov"] */
function departDays(){
  const base = new Date((S.cfg.start_date || "2026-11-05") + "T00:00:00"), out = [];
  for (let k = -2; k <= 0; k++){ const d = new Date(base); d.setDate(base.getDate() + k); const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; out.push([iso, `${ZILE[d.getDay()]} ${d.getDate()} ${d.toLocaleDateString("ro-RO", { month: "long" })}`]); }
  return out;
}
function departWhen(c){
  if (c?.depart_date){ const d = new Date(c.depart_date + "T00:00:00"); const t = `${ZILE[d.getDay()]} ${d.getDate()} ${d.toLocaleDateString("ro-RO", { month: "short" }).replace(".", "")}`; return c.depart_time ? `${t}, ${String(c.depart_time).slice(0, 5)}` : t; }
  return c?.when_text || "";
}
function carInfo(c, big){
  const when = departWhen(c), where = [c.meet_point, c.from_city].filter(Boolean).join(", ");
  const map = safeUrl(c.meet_maps) || (c.meet_point ? mapsUrl(where) : "");
  const line = [when && `<b>${esc(when)}</b>`, where && esc(where)].filter(Boolean).join(" · ");
  return `${line || map ? `<p class="car-route ${big ? "big" : ""}">${line}${map ? `${line ? " · " : ""}<a href="${esc(map)}" target="_blank" rel="noopener">Hartă ›</a>` : ""}</p>` : `<p class="small muted">${c.owner === S.uid ? "N-ai pus încă ora și locul de plecare." : "Șoferul n-a pus încă ora și locul de plecare."}</p>`}

  const nr = noRide(); if (nr.length) L.push(`Fără loc: ${nr.map(p => p.name + (p.pickup ? " (de acasă)" : "")).join(", ")}`);
  const gw = guestsNoRide(); if (gw.length) L.push(`Fără cont, fără loc: ${gw.map(g => g.name).join(", ")}`);
  const own = people().filter(ownWay); if (own.length) L.push(`Pe cont propriu: ${own.map(p => p.name).join(", ")}`);
  if (S.cfg.doc_url){ const ns = people().filter(p => !declOk(p)); L.push("", `DECLARAȚIA: au confirmat ${people().length - ns.length} din ${people().length}${ns.length ? `. Nu încă: ${ns.map(p => p.name).join(", ")}` : ""}`); }
  const notReady = people().filter(p => missingOf(p).length);
  if (notReady.length){ L.push("", "ÎNCĂ LE LIPSEȘTE"); for (const p of notReady){ const m = missingOf(p); L.push(`${p.name}: ${m.length > 6 ? `${m.length} lucruri` : m.map(nm).join(", ")}`); } }
  return L.join("\n");
}

/* ---------- sheets ---------- */
function openSheet(kind, data){
  if (!S.sheet){ try { history.pushState({ sheet: true }, "", location.href); } catch {} }
  else if (S.sheet.kind === "item") saveNoteDraft();
  S.lastFocus = document.activeElement; S.sheet = { kind, data }; renderSheet(true);
}
function closeSheet(fromHistory){
  if (!S.sheet) return;
  if (S.sheet.kind === "item") saveNoteDraft();
  if (S.sheet.kind === "pickmap") closeMapPicker();
  S.sheet = null; $("sheetWrap").hidden = true; document.body.style.overflow = ""; document.body.classList.remove("sheet-open");
  for (const id of ["page", "tabbar", "rail"]) { const el = $(id); if (el) el.inert = false; }
  try { if (S.lastFocus?.isConnected) S.lastFocus.focus({ preventScroll: true }); } catch {}
  if (!fromHistory){ try { if (history.state?.sheet) history.back(); } catch {} }
}
function saveNoteDraft(){
  const ta = $("noteText"), id = S.sheet?.data;
  if (!ta || !id) return;
  const n = ta.value.trim();
  if (n !== st(S.me, id).note) setItem(id, { note: n }, true);
}
const sw = (attrs, label, sub, on, cls = "") => `<button type="button" class="check-row" role="switch" aria-checked="${on}" ${attrs}><span class="lbl"><b>${label}</b>${sub ? `<span>${sub}</span>` : ""}</span><span class="toggle ${cls}" aria-hidden="true"></span></button>`;
function sheetHtml(){
  const { kind, data } = S.sheet;
  const head = (title, sub) => `<div class="sheet-head"><div style="flex:1"><h2 class="h2">${title}</h2>${sub ? `<p class="muted small" style="margin-top:4px">${sub}</p>` : ""}</div><button class="x" data-close aria-label="Închide">✕</button></div>`;
  if (kind === "item"){
    const it = itemById(data); if (!it) return head("Obiect șters");
    const s = st(S.me, it.id), team = isTeam(it);
    const lenders = lendersOf(it.id, S.uid);
    return head(esc(it.name), esc(team ? "Echipament de echipă" : `${groupOf(it)}${isOpt(it) ? "" : " · obligatoriu"}`)) + `<div>
      ${sw(`data-flagset="ok"`, team ? "Aduc eu" : "Am", "", s.ok)}
      ${isOpt(it) ? sw(`data-flagset="skip"`, "Nu iau", "E opțional, îl poți lăsa acasă.", s.skip) : ""}
      ${team ? "" : sw(`data-flagset="need"`, "Caut", lenders.length ? `Au în plus: ${esc(lenders.map(shortName).join(", "))}` : "Apare la Grupul › Se caută, ca să te ajute cineva.", s.need, "red")}

  if (kind === "person"){
    const p = byId(data); if (!p) return head("Persoană");
    const miss = missingOf(p), car = carOf(p.id), tm = teamOf(p.id);

        ${sec("Caută", chipList(S.items.filter(i => st(p, i.id).need), "need"))}

        ${sec("Transport", car ? `<span>${car.owner === p.id ? "Conduce" : `Merge cu ${esc(nameOf(car.owner))}`}</span>` : ownWay(p) ? "<span>Vine pe cont propriu</span>" : '<span class="chip need" style="align-self:flex-start">Încă fără loc</span>')}

      <div class="grid2"><label class="field"><span>Ziua plecării</span><select class="input" id="cf-date"><option value="">Alege ziua</option>${[...departDays(), ...(c.depart_date && !departDays().some(([v]) => v === c.depart_date) ? [[c.depart_date, departWhen({ depart_date: c.depart_date })]] : [])].map(([v, l]) => `<option value="${v}" ${c.depart_date === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>

/* re-render keeps whatever the person has typed in the sheet */
function renderSheet(first){
  if (!S.sheet) return;
  if (!first && S.sheet.kind === "pickmap") return;
  const body = $("sheetBody"), keep = {};
  if (!first) body.querySelectorAll("input,textarea,select,output").forEach(el => { if (el.id && el.type !== "file") keep[el.id] = el.tagName === "OUTPUT" ? el.textContent : el.value; });
  const focusId = !first && body.contains(document.activeElement) ? document.activeElement.id : null;
  body.innerHTML = `<div class="grab" aria-hidden="true"></div>` + sheetHtml();
  for (const [id, v] of Object.entries(keep)){ const el = $(id); if (!el) continue; if (el.tagName === "OUTPUT") el.textContent = v; else el.value = v; }
  if (focusId && $(focusId)) $(focusId).focus();
  $("sheetWrap").hidden = false; document.body.style.overflow = "hidden"; document.body.classList.add("sheet-open");
  const h = body.querySelector(".sheet-head h2"); if (h){ h.id = "sheetTitle"; body.setAttribute("aria-labelledby", "sheetTitle"); }
  body.setAttribute("role", "dialog"); body.setAttribute("aria-modal", "true");
  for (const id of ["page", "tabbar", "rail"]) { const el = $(id); if (el) el.inert = true; }
  if (first) setTimeout(() => body.querySelector(".x")?.focus({ preventScroll: true }), 30);
}

let lastView = "";
const viewKey = () => [S.uid ? (S.me?.status || "-") : "out", S.recovering, S.authMode, S.page, S.gearTab, S.groupTab, S.adminTab].join("|");
function focusSig(el){
  if (!el) return null;
  const d = [...el.attributes].filter(x => x.name.startsWith("data-")).map(x => [x.name, x.value]);
  return d.length ? d : (el.id ? [["id", el.id]] : null);
}
function findFocus(sig){
  const sel = sig.map(([k, v]) => k === "id" ? `#${CSS.escape(v)}` : `[${k}="${CSS.escape(v)}"]`).join("");
  let el = $("page").querySelector(sel); if (el) return el;
  /* same kind of control whose state value changed (e.g. Caut on/off) */
  const idv0 = sig.find(([k]) => k === "data-id");
  if (idv0){ el = $("page").querySelector(sig.filter(([k]) => k !== "data-id").map(([k]) => `[${k}]`).join("") + `[data-id="${CSS.escape(idv0[1])}"]`); if (el) return el; }
  const br = sig.find(([k]) => k === "data-bring"); if (br){ el = $("page").querySelector(`[data-qty="1"][data-id="${CSS.escape(br[1])}"]`); if (el) return el; }
  /* the control was swapped (e.g. "Aduc eu" -> stepper): find one that refers to the same thing */
  for (const [k, v] of sig){ if (!v || k === "data-qty") continue; el = $("page").querySelector(`[data-id="${CSS.escape(v)}"],[data-bring="${CSS.escape(v)}"],[data-toggle="${CSS.escape(v)}"],[data-dnd="${CSS.escape(v)}"]`); if (el) return el; }
  const idv = sig.find(([k]) => k === "data-id"); if (idv){ el = $("page").querySelector(`[data-bring="${CSS.escape(idv[1])}"],[data-id="${CSS.escape(idv[1])}"]`); if (el) return el; }
  return null;
}
function render(){
  const inApp = !!(S.uid && S.me && approved() && !S.recovering && !S.loadFailed);
  renderChrome(inApp);
  let html;
  if (!S.loaded) html = '<div class="block empty">Se încarcă…</div>';
  else if (S.loadFailed) html = `<div class="block empty"><b>Nu s-au încărcat datele</b>Verifică internetul.<div class="row" style="justify-content:center;margin-top:12px"><button class="btn sec sm" data-retry>Reîncearcă</button></div></div>`;
  else if (!S.uid || S.recovering) html = pageAuth();
  else if (!S.me) html = S.meMissing >= 3 ? `<div class="auth"><div class="block stack"><h2 class="h2">Ceva n-a mers</h2><p class="muted">Contul tău nu s-a putut pregăti. Scrie-i lui Clau.</p><button class="btn sec" data-logout>Ieși din cont</button></div></div>` : '<div class="block empty">Îți pregătim contul…</div>';
  else if (!approved()) html = pagePending();
  else {
    if (S.page === "admin" && !isAdmin()) S.page = "home";
    html = { home: pageHome, gear: pageGear, team: pageTeam, transport: pageTransport, group: pageGroup, admin: pageAdmin }[S.page]();
  }
  // don't wipe a field the person is typing in
  const a = document.activeElement, typing = a && $("page").contains(a) && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") ? a.id : null;
  if (typing === "q" && $("peopleList") && viewKey() === lastView){ $("peopleList").innerHTML = peopleRows(groupList(), reqItems().length); }
  else if (typing === "listQ" && $("listBody") && viewKey() === lastView){ const tmp = document.createElement("div"); tmp.innerHTML = html; const nb = tmp.querySelector("#listBody"); if (nb) $("listBody").innerHTML = nb.innerHTML; }
  else if (typing && viewKey() === lastView){ /* keep the form as is; it refreshes on the next render */ }
  else {
    /* keep keyboard / screen-reader focus on the same control after the page is redrawn */
    const fsel = focusSig(a && $("page").contains(a) ? a : null), y = window.scrollY;
    $("page").innerHTML = html;
    if (fsel){ const el = findFocus(fsel); if (el){ el.focus({ preventScroll: true }); if (Math.abs(window.scrollY - y) > 2) window.scrollTo(0, y); } }
  }
  lastView = viewKey();
  if (S.sheet) renderSheet(false);
  applyArmed();
}

/* ---------- writes ---------- */
function setItem(itemId, patch, quiet){
  if (!S.me) return;
  const it = itemById(itemId) || {};
  const cur = { ...st(S.me, itemId), ...patch };
  if (patch.ok === true){ cur.need = false; cur.skip = false; }
  if (patch.ok === false && !isOpt(it)) cur.lend = false;
  if (patch.need === true){ cur.ok = false; cur.skip = false; cur.lend = false; }
  if (patch.skip === true){ cur.ok = false; cur.need = false; }
  if (patch.lend === true){ cur.need = false; if (!isOpt(it) && !isTeam(it)) cur.ok = true; }
  const val = { ok: cur.ok, need: cur.need, lend: cur.lend, skip: cur.skip, note: cur.note, ...(cur.qty > 1 ? { qty: cur.qty } : {}) };
  S.me.items = { ...(S.me.items || {}), [itemId]: val };
  if (!quiet) render();
  return write(() => sb.rpc("set_item", { item_id: itemId, val }));
}
async function approve(p, quiet){
  if (!p) return false;
  const m = rosterMatch(p), team = !p.team && m && S.teams.find(t => t.id === m.team), seat = !p.ride && m?.ride && S.cars.some(c => c.id === m.ride) ? m.ride : null;
  if (seat) await sb.from("roster").update({ ride: null }).eq("id", m.id);
  const ok = await upd(p.id, { status: "approved", ...(team ? { team: team.id } : {}), ...(seat ? { ride: seat, own_transport: false } : {}) }, quiet ? "" : `${firstName(p.name)} e în grup${team ? `, în ${team.name}` : ""}`);
  if (ok && m && (m.profile !== p.id || m.ride)) await sb.from("roster").update({ profile: p.id, ride: null }).eq("id", m.id);
  return !!ok;
}
const upd = (id, v, msg) => write(() => sb.from("profiles").update(v).eq("id", id), msg);
const setRide = (uid, carId, msg) => write(() => sb.from("profiles").update({ ride: carId || null }).eq("id", uid), msg);
async function copyText(txt, okMsg){
  try { await navigator.clipboard.writeText(txt); toast(okMsg); }
  catch { toast("Nu am putut copia. Selectează textul și copiază-l manual.", true); }
}

  if ((b = q("[data-step]"))){ const o = $("cf-seats"), v = Math.max(Number(o.dataset.min) || 0, Math.min(8, Number(o.textContent) + Number(b.dataset.step))); o.textContent = v; return; }
  if ((b = q("[data-join]"))){ const c = S.cars.find(x => x.id === b.dataset.join); await busy(b, () => upd(S.uid, { ride: b.dataset.join, own_transport: false }, `Ai loc la ${nameOf(c?.owner)}`)); return; }
  if ((b = q("[data-leave]"))){ if (!arm(b, "Apasă încă o dată: renunți la loc")) return; await setRide(S.uid, null, "Ai renunțat la loc"); return; }
  if (q("[data-copy-mycar]")){ const c = S.cars.find(x => x.owner === S.uid); if (c) await copyText(myCarText(c), "Copiat. Lipește-l în grupul de WhatsApp."); return; }
  if ((b = q("[data-unguest]"))){ const g = guestBy(b.dataset.unguest); if (g){ g.ride = null; renderSheet(false); render(); await write(() => sb.rpc("seat_guest", { guest: g.id, car: null }), `${firstName(g.name)} nu mai e în mașină`); } return; }
  if ((b = q("[data-ownway]"))){ const on = b.dataset.ownway === "1"; await busy(b, () => upd(S.uid, { own_transport: on, ...(on ? { ride: null } : {}) }, on ? "Notat: vii pe cont propriu" : "Gata, alege un loc")); return; }
  if ((b = q("[data-unseat]"))){ const p = byId(b.dataset.unseat), was = p?.ride; if (p) p.ride = null; renderSheet(false); render();
    if (!(await write(() => sb.rpc("unseat", { person: b.dataset.unseat }), `${nameOf(b.dataset.unseat)} nu mai e în mașină`)) && p) p.ride = was; return; }
  if ((b = q("[data-car-del]"))){ if (!arm(b, "Apasă încă o dată ca să ștergi")) return; if (await write(() => sb.from("cars").delete().eq("id", b.dataset.carDel), "Mașina a fost ștearsă")) closeSheet(); return; }
  if (q("[data-map-open]")){ openMapPicker(); return; }
  if ((b = q("[data-locate]"))){
    if (!navigator.geolocation){ toast("Telefonul nu dă locația. Atinge pe hartă.", true); return; }
    b.disabled = true; b.textContent = "Caut locația…";
    navigator.geolocation.getCurrentPosition(pos => { if (!pickMap) return; b.disabled = false; b.textContent = "📍 Locația mea"; const { latitude: la, longitude: lo } = pos.coords; window.__placePin?.(la, lo); pickMap?.setView([la, lo], 17); },
      err => { if (!b.isConnected) return; b.disabled = false; b.textContent = "📍 Locația mea"; toast(err.code === 1 ? "Ai refuzat accesul la locație. Atinge pe hartă locul tău." : "Nu am găsit locația. Atinge pe hartă.", true); },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
    return;
  }
  if (q("[data-map-save]")){
    if (!pickPoint) return;
    const link = mapsLink(pickPoint[0], pickPoint[1]), note = (S.pk ? S.pk.note : S.me.pickup_note || "").trim().slice(0, 60);
    const patch = { pickup: true, pickup_maps: link, pickup_note: note };
    Object.assign(S.me, patch); S.pk = null; closeSheet();
    await upd(S.uid, patch, "Gata, șoferul vede de unde să te ia"); render(); return;
  }
  if ((b = q("[data-scroll]"))){ $(b.dataset.scroll)?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if ((b = q("[data-teamview]"))){ S.teamView = b.dataset.teamview; render(); return; }
  if ((b = q("[data-qty]"))){ const id = b.dataset.id, q2 = st(S.me, id).qty + Number(b.dataset.qty);
    if (q2 < 1){ setItem(id, { ok: false, qty: 1 }); toast("Nu mai aduci"); } else setItem(id, { qty: Math.min(9, q2) }); return; }
  if ((b = q("[data-bring]"))){ const id = b.dataset.bring, on = !has(S.me, id); setItem(id, { ok: on }); toast(on ? "Notat: aduci tu" : "Nu mai aduci"); return; }
  if (q("[data-tent-new]")){ if (S.tents.some(t => t.owner === S.uid)){ toast("Ai deja un cort. Îl poți edita.", true); return; } openSheet("tent", null); return; }
  if ((b = q("[data-tent-slot]"))){ openSheet("tentpick", b.dataset.tentSlot); return; }
  if ((b = q("[data-tent-put]")) || (b = q("[data-tent-out]"))){
    const put = !!b.dataset.tentPut, pid = b.dataset.tentPut || b.dataset.tentOut, tid = S.sheet?.data, p = byId(pid);
    if (p) p.tent = put ? tid : null; renderSheet(false); render();
    await write(() => sb.rpc("tent_place", { tent_id: tid, person: pid, put }), put ? `${shortName(p)} doarme în cortul ăsta` : `${shortName(p)} a ieșit din cort`);
    if (put && S.sheet && !tentFree(S.tents.find(x => x.id === tid) || {})) closeSheet();
    return;
  }
  if ((b = q("[data-tent-edit]"))){ openSheet("tent", { ...S.tents.find(t => t.id === b.dataset.tentEdit) }); return; }
  if ((b = q("[data-tstep]"))){ const o = $("tf-places"); o.textContent = Math.max(Number(o.dataset.min) || 1, Math.min(8, Number(o.textContent) + Number(b.dataset.tstep))); return; }
  if ((b = q("[data-tent-join]"))){ const t = S.tents.find(x => x.id === b.dataset.tentJoin); if (!t || !tentFree(t)){ toast("Cortul e plin.", true); return; } S.me.tent = t.id; render(); await upd(S.uid, { tent: t.id }, `Dormi în cortul lui ${nameOf(t.owner)}`); return; }
  if (q("[data-tent-leave]")){ S.me.tent = null; render(); await upd(S.uid, { tent: null }, "Ai ieșit din cort"); return; }
  if ((b = q("[data-tent-del]"))){ if (!arm(b, "Apasă încă o dată ca să ștergi")) return; const tt = S.tents.find(x => x.id === b.dataset.tentDel), ti = tentItem();
    if (await write(() => sb.from("tents").delete().eq("id", b.dataset.tentDel), "Cortul a fost șters")){
      if (tt?.owner === S.uid && ti && has(S.me, ti.id)) setItem(ti.id, { ok: false }, true);
      else if (tt && isAdmin() && ti){ const o = byId(tt.owner); if (o && has(o, ti.id)){ const items = { ...(o.items || {}), [ti.id]: { ...(o.items?.[ti.id] || {}), ok: false } }; o.items = items; await upd(o.id, { items }); } }
      closeSheet(); } return; }
  if ((b = q("[data-tent-give]"))){ const t = S.sheet?.data, to = byId(b.dataset.tentGive); if (!t?.id || !to) return; if (!arm(b, `Apasă încă o dată: îl dai lui ${shortName(to)}`)) return;
    if (await write(() => sb.from("tents").update({ owner: to.id }).eq("id", t.id), `Cortul e acum al lui ${shortName(to)}`)){ const ti = tentItem(); if (t.owner === S.uid && ti && has(S.me, ti.id)) setItem(ti.id, { ok: false }, true); closeSheet(); } return; }
  if ((b = q("[data-dropzone]")) && S.pick){ moveTo(S.pick, b.dataset.dropzone); return; }
  if (q("[data-copy-cars]")){ await copyText(carsText(), "Lista mașinilor e copiată"); return; }
  if ((b = q("[data-board]"))){ S.board = b.dataset.board === "1"; S.pick = null; render(); window.scrollTo({ top: 0 }); return; }
  if ((b = q("[data-dnd]"))){ if (Date.now() - (window.__xccSuppressClick || 0) < 300) return; S.pick = S.pick === b.dataset.dnd ? null : b.dataset.dnd; render(); return; }
  if ((b = q("[data-zone]")) && S.pick){ moveTo(S.pick, b.dataset.zone); return; }
  // admin
  if ((b = q("[data-copy]"))){ await copyText(b.dataset.copy, "Mesaj copiat"); return; }
  if (q("[data-copy-summary]")){ await copyText(summaryText(), "Rezumat copiat"); return; }
  if ((b = q("[data-approve]"))){ const p = byId(b.dataset.approve); await busy(b, () => approve(p)); return; }
  if ((b = q("[data-approve-all]"))){ if (!arm(b, `Apasă încă o dată: aprobi ${pending().length}`)) return; await busy(b, async () => { let ok = 0; for (const p of pending()){ if (await approve(p, true)) ok++; } toast(plural(ok, "om aprobat", "oameni aprobați")); scheduleReload(100); }); return; }
  if ((b = q("[data-reject]"))){
    const p = byId(b.dataset.reject); if (!arm(b, "Apasă încă o dată ca să confirmi")) return;
    const car = S.cars.find(c => c.owner === p?.id);
    if (car) await write(() => sb.from("cars").delete().eq("id", car.id));
    await upd(b.dataset.reject, { status: "rejected", ride: null, team: null }, `${firstName(p?.name)} nu mai e în grup`); closeSheet(); return;
  }
  if ((b = q("[data-aperson]"))){ openSheet("aperson", b.dataset.aperson); return; }
  if ((b = q("[data-arole]"))){ const on = b.getAttribute("aria-checked") !== "true"; if (!arm(b, on ? "Apasă încă o dată: îl faci admin" : "Apasă încă o dată: nu mai e admin")) return; await upd(b.dataset.arole, { role: on ? "admin" : "member" }, on ? "E admin acum" : "Nu mai e admin"); return; }
  if ((b = q("[data-areset]"))){ if (!arm(b)) return; await upd(b.dataset.areset, { items: {} }, `Am golit bifele lui ${nameOf(b.dataset.areset)}`); return; }
  if ((b = q("[data-setteam]"))){ const pid = b.dataset.setteam, tid = b.dataset.tid || null, p = byId(pid); const owns = S.tents.some(t => t.owner === pid), patch = { team: tid, ...(owns ? {} : { tent: null }) }; if (p) Object.assign(p, patch); render(); await upd(pid, patch, tid ? `${shortName(p)} e în ${S.teams.find(x => x.id === tid)?.name}` : `${shortName(p)} e fără echipă`); return; }
  if ((b = q("[data-team-edit]"))){ openSheet("team-edit", b.dataset.teamEdit); return; }
  if ((b = q("[data-team-del]"))){ if (!arm(b, "Apasă încă o dată ca să ștergi")) return; if (await write(() => sb.from("teams").delete().eq("id", b.dataset.teamDel), "Echipa a fost ștearsă")) closeSheet(); return; }
  if (q("[data-item-new]")){ openSheet("item-edit", null); return; }
  if ((b = q("[data-item-edit]"))){ openSheet("item-edit", b.dataset.itemEdit); return; }
  if ((b = q("[data-item-del]"))){ if (!arm(b, "Apasă încă o dată ca să ștergi")) return; if (await write(() => sb.from("items").delete().eq("id", b.dataset.itemDel), "Obiectul a fost șters")) closeSheet(); return; }
  if (q("[data-doc-title]")){ await write(() => sb.from("config").update({ doc_name: ($("docName")?.value || "").trim() || "Declarația pe propria răspundere" }).eq("id", 1), "Titlul a fost salvat"); return; }
  if ((b = q("[data-doc-clear]"))){ if (!arm(b)) return; await write(() => sb.from("config").update({ doc_url: "" }).eq("id", 1), "Documentul a fost scos"); return; }
  if ((b = q("[data-hero-clear]"))){ if (!arm(b)) return; await write(() => sb.from("config").update({ hero_url: "" }).eq("id", 1), "Ilustrația e înapoi"); return; }
  if ((b = q("[data-reset-all]"))){
    if (!arm(b, "Sigur? Apasă încă o dată: se golesc bifele tuturor")) return;
    await busy(b, async () => { let fail = 0; for (const p of people()){ const r = await sb.from("profiles").update({ items: {} }).eq("id", p.id); if (r.error) fail++; } toast(fail ? `${fail} n-au reușit. Încearcă din nou.` : "Bifele tuturor au fost golite", !!fail); scheduleReload(100); });
    return;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet) closeSheet(); });
document.addEventListener("input", e => {
  if (e.target.id === "q"){ S.q = e.target.value; render(); }
  if (e.target.id === "listQ"){ S.listQ = e.target.value; render(); }
});
document.addEventListener("change", e => { if (e.target.id === "pk-on"){ const f = document.querySelector(".pk-fields"); if (f) f.hidden = !e.target.checked; readPk(); } });
document.addEventListener("input", e => { if (e.target.id === "pk-maps" || e.target.id === "pk-note") readPk(); });
document.addEventListener("focusout", e => { if (e.target.id === "noteText") saveNoteDraft(); });
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.assignSel !== undefined){ await setRide(t.dataset.assignSel, t.value, "Salvat"); return; }
  if (t.dataset.addguest !== undefined && t.value){ const g = guestBy(t.value), c = S.cars.find(x => x.id === t.dataset.addguest); if (!g || !c) return;
    if (!freeOf(c)){ toast("Mașina e plină.", true); return; } g.ride = c.id; renderSheet(false); render();
    await write(() => sb.rpc("seat_guest", { guest: g.id, car: c.id }), `${firstName(g.name)} merge cu tine`); return; }
  if (t.id === "docFile" && t.files?.[0]){
    const f = t.files[0];
    if (f.size > 10e6){ toast("Fișierul e prea mare. Maxim 10 MB.", true); return; }
    toast("Se încarcă documentul…");
    const ext = (f.name.split(".").pop() || "pdf").toLowerCase().replace(/[^a-z0-9]/g, "") || "pdf";
    const path = `docs/declaratie-${Date.now()}.${ext}`;
    const up = await sb.storage.from("media").upload(path, f, { contentType: f.type || "application/octet-stream", upsert: false });
    if (up.error){ toast("Documentul nu s-a încărcat. Încearcă din nou.", true); return; }
    const url = sb.storage.from("media").getPublicUrl(path).data.publicUrl;
    await write(() => sb.from("config").update({ doc_url: url, doc_name: ($("docName")?.value || "").trim() || "Declarația pe propria răspundere" }).eq("id", 1), "Documentul e pe Acasă");
    return;
  }
  if (t.id === "heroFile" && t.files?.[0]){
    const f = t.files[0];
    if (f.size > 8e6){ toast("Poza e prea mare. Maxim 8 MB.", true); return; }
    toast("Se încarcă poza…");
    const ext = (f.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
    const path = `hero-${Date.now()}.${ext}`;
    const up = await sb.storage.from("media").upload(path, f, { contentType: f.type, upsert: false });
    if (up.error){ toast("Poza nu s-a încărcat. Încearcă un JPG sau PNG.", true); return; }
    const url = sb.storage.from("media").getPublicUrl(path).data.publicUrl;
    await write(() => sb.from("config").update({ hero_url: url }).eq("id", 1), "Poza e pe Acasă");
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const id = e.target.id, v = x => $(x).value.trim(), btn = e.submitter || e.target.querySelector('[type="submit"]');
  await busy(btn, async () => {
    if (id === "loginForm"){
      const r = await sb.auth.signInWithPassword({ email: v("le"), password: $("lp").value });
      if (r.error) toast(/confirm/i.test(r.error.message) ? "Confirmă întâi emailul din mesajul primit." : /invalid|credentials/i.test(r.error.message) ? "Email sau parolă greșită. Ai uitat parola? Apasă „Am uitat parola”." : authErr(r.error.message), true);
    }
    if (id === "signupForm"){
      if ($("sp").value.length < 8){ toast("Parola trebuie să aibă minim 8 caractere.", true); return; }
      const email = v("se");
      const r = await sb.auth.signUp({ email, password: $("sp").value, options: { data: { name: v("sn") }, emailRedirectTo: SITE } });
      if (r.error) toast(/registered|exists/i.test(r.error.message) ? "Ai deja cont cu acest email. Apasă „Am cont”." : authErr(r.error.message), true);
      else if (r.data?.user && Array.isArray(r.data.user.identities) && r.data.user.identities.length === 0){ S.checkEmail = email; S.authMode = "login"; render(); toast("Ai deja cont cu acest email. Intră sau apasă „Am uitat parola”.", true); }
      else if (!r.data?.session){ S.checkEmail = email; S.authMode = "check"; render(); }
    }
    if (id === "forgotForm"){
      const email = v("fe");
      const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE });
      if (r.error) toast(authErr(r.error.message), true);
      else { S.checkEmail = email; S.authMode = "sent"; render(); }
    }
    if (id === "newPassForm" || id === "passForm"){
      const pw = $(id === "newPassForm" ? "np" : "pp").value;
      if (pw.length < 8){ toast("Parola trebuie să aibă minim 8 caractere.", true); return; }
      const r = await sb.auth.updateUser({ password: pw });
      if (r.error) toast(authErr(r.error.message), true);
      else { S.recovering = false; closeSheet(); toast("Parola a fost schimbată"); try { history.replaceState(null, "", SITE); } catch {} loadAll(); }
    }
    if (id === "nameForm"){
      const n = v("pn"); if (!n){ toast("Scrie un nume.", true); return; }
      if (await upd(S.uid, { name: n }, "Nume salvat")) closeSheet();
    }
    if (id === "carForm"){
      const c = S.sheet?.data;
      const data = { seats: Math.max(0, Math.min(8, Number($("cf-seats").textContent) || 0)), from_city: v("cf-from"), note: v("cf-note"), label: v("cf-label"),
        meet_point: v("cf-meet"), meet_maps: fixUrl(v("cf-maps")), depart_date: $("cf-date").value || null, depart_time: $("cf-time").value || null, back_text: v("cf-back") };
      if (data.depart_date) data.when_text = "";
      { const bad = badLink(data.meet_maps); if (bad){ toast(bad, true); $("cf-maps").focus(); return; } }
      if (c?.id){ if (await write(() => sb.from("cars").update(data).eq("id", c.id), "Mașina a fost salvată")) closeSheet(); }
      else {
        const r = await write(() => sb.from("cars").insert({ ...data, owner: S.uid }).select().single());
        if (r?.data){ await upd(S.uid, { ride: r.data.id, own_transport: false }, "Mașina ta e pe listă"); closeSheet(); }
      }
    }
    if (id === "addTeam"){ const n = v("teamNameNew"); if (n && await write(() => sb.from("teams").insert({ name: n }), `${n} a fost creată`)) $("teamNameNew").value = ""; }
    if (id === "teamForm"){ const n = v("tn"); if (n && await write(() => sb.from("teams").update({ name: n }).eq("id", S.sheet.data), "Salvat")) closeSheet(); }
    if (id === "tentForm"){
      const t = S.sheet?.data, data = { places: Math.max(1, Math.min(8, Number($("tf-places").textContent) || 2)), label: v("tf-label"), auto: false };
      if (t?.id){ if (await write(() => sb.from("tents").update(data).eq("id", t.id), "Cortul a fost salvat")) closeSheet(); }
      else {
        const team = teamOf(S.uid); if (!team){ toast("Nu ești într-o echipă.", true); return; }
        const r = await write(() => sb.from("tents").insert({ ...data, team: team.id, owner: S.uid }).select().single());
        if (r?.data){ await upd(S.uid, { tent: r.data.id }, "Cortul tău e pe listă"); const ti = tentItem(); if (ti && !has(S.me, ti.id)) setItem(ti.id, { ok: true }, true); closeSheet(); }
      }
    }
    if (id === "pickupForm"){
      const on = $("pk-on").checked, url = fixUrl(v("pk-maps"));
      if (on && url){ const bad = badLink(url); if (bad){ toast(bad, true); const d = document.querySelector(".pk-alt"); if (d) d.open = true; $("pk-maps").focus(); return; } }
      const patch = { pickup: on, pickup_maps: on ? url : "", pickup_note: on ? v("pk-note") : "" };
      Object.assign(S.me, patch); S.pk = null;
      await upd(S.uid, patch, on ? (url ? "Șoferul vede de unde să te ia" : "Notat. Adaugă și linkul cu locația.") : "Nu mai ești pe lista de luat de acasă");
    }
    if (id === "cityForm"){ const c = v("myCity"); S.me.city = c; await upd(S.uid, { city: c }, c ? `Notat: pleci din ${c}` : "Șters"); }
    if (id === "placesForm"){ const eu = fixUrl(v("ev-u")), fu = fixUrl(v("fd-u")), bad = badLink(eu) || badLink(fu); if (bad){ toast(bad, true); return; }
      await write(() => sb.from("config").update({ event_name: v("ev-n"), event_maps: eu, food_name: v("fd-n"), food_maps: fu, event_note: v("ev-t"), food_note: v("fd-t") }).eq("id", 1), "Locațiile au fost salvate"); }
    if (id === "dateForm"){ await write(() => sb.from("config").update({ start_date: $("startDate").value || null }).eq("id", 1), "Data a fost salvată"); }
    if (id === "itemForm"){
      const itId = e.target.dataset.id, name = v("in"), cat = $("ic").value;
      if (!name) return;
      const ok = itId ? await write(() => sb.from("items").update({ name, cat }).eq("id", itId), "Salvat")
        : await write(() => sb.from("items").insert({ id: "x" + Date.now().toString(36), name, cat, ord: Math.max(0, ...S.items.map(i => Number(i.ord) || 0)) + 1 }), `${name} e pe listă`);
      if (ok) closeSheet();
    }
  });
});

/* ---------- boot ---------- */
readHash();
render();
sb.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") S.recovering = true;
  const uid = session?.user?.id || null;
  S.email = session?.user?.email || "";
  if (uid !== S.uid){ S.uid = uid; S.me = null; S.profiles = []; S.meMissing = 0; if (uid) subscribe(); }
  setTimeout(loadAll, 0);
});

</script>
</body>
</html>
